<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Orders — M3RAFSH Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-sidebar-slot"></div>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Orders</h1></div>
    <div class="admin-toolbar">
      <input type="text" class="admin-search" id="search-input" placeholder="Search by order # or customer...">
      <select id="status-filter" style="padding:10px 14px;border:1px solid var(--color-line);border-radius:6px">
        <option value="">All Statuses</option>
        <option>Processing</option><option>Confirmed</option><option>Shipped</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option>
      </select>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th></th></tr></thead>
        <tbody id="table-body"><tr><td colspan="7">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
function formatPrice(n) { return '$' + Number(n).toFixed(2).replace(/\.00$/, ''); }
let orders = [];

function render(list) {
  document.getElementById('table-body').innerHTML = list.length ? list.map(o => `
    <tr>
      <td><a href="/admin/order-detail.html?id=${o.id}">${o.order_number}</a></td>
      <td>${escapeHTML(o.user_name)}<br><span class="text-soft" style="font-size:11.5px">${escapeHTML(o.user_email)}</span></td>
      <td>—</td>
      <td>${formatPrice(o.total)}</td>
      <td><span class="status-pill">${o.status}</span></td>
      <td>${new Date(o.created_at).toLocaleDateString()}</td>
      <td><a class="table-action-btn" href="/admin/order-detail.html?id=${o.id}">View</a></td>
    </tr>`).join('') : `<tr><td colspan="7">No orders yet.</td></tr>`;
}

function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const status = document.getElementById('status-filter').value;
  render(orders.filter(o => (!status || o.status === status) && (o.order_number.toLowerCase().includes(q) || o.user_name.toLowerCase().includes(q) || o.user_email.toLowerCase().includes(q))));
}
document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('status-filter').addEventListener('change', applyFilters);

async function load() {
  const user = await adminGuard('orders');
  if (!user) return;
  const { orders: o } = await API.get('/api/admin/orders');
  orders = o;
  render(orders);
}
load();
</script>
</body>
</html>
