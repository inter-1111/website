<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="account-settings">
<div id="site-header-slot"></div>

<div class="container dash-layout">
  <div id="dash-nav-slot"></div>
  <div style="max-width:520px">
    <h1 class="dash-welcome">Account Settings</h1>
    <p class="dash-sub">Update your profile and password.</p>

    <div class="checkout-section">
      <h3>Profile</h3>
      <div class="field"><label>Full Name</label><input id="p-name"></div>
      <div class="field"><label>Email</label><input id="p-email" readonly></div>
      <div class="field"><label>Phone</label><input id="p-phone"></div>
      <button class="btn btn-primary" id="save-profile-btn">Save Changes</button>
    </div>

    <div class="checkout-section">
      <h3>Change Password</h3>
      <div class="field"><label>Current Password</label><input type="password" id="cur-pass"></div>
      <div class="field"><label>New Password</label><input type="password" id="new-pass" minlength="6"></div>
      <button class="btn btn-secondary" id="change-pass-btn">Update Password</button>
    </div>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
async function load() {
  if (!requireAuthOrRedirect()) return;
  document.getElementById('dash-nav-slot').innerHTML = dashNavHTML('settings');
  initDashLogout();
  document.getElementById('p-name').value = SITE.user.name;
  document.getElementById('p-email').value = SITE.user.email;
  document.getElementById('p-phone').value = SITE.user.phone || '';
}
document.addEventListener('chrome:ready', load);

document.getElementById('save-profile-btn').addEventListener('click', async () => {
  await API.put('/api/auth/me', { name: document.getElementById('p-name').value, phone: document.getElementById('p-phone').value });
  Toast.show('Profile updated.');
});

document.getElementById('change-pass-btn').addEventListener('click', async () => {
  try {
    await API.post('/api/auth/change-password', { currentPassword: document.getElementById('cur-pass').value, newPassword: document.getElementById('new-pass').value });
    Toast.show('Password updated.');
    document.getElementById('cur-pass').value = ''; document.getElementById('new-pass').value = '';
  } catch (e) { Toast.show(e.message); }
});
</script>
</body>
</html>
