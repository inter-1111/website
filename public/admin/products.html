<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products — M3RAFSH Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-sidebar-slot"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Products</h1>
      <a href="/admin/product-edit.html" class="btn btn-primary btn-sm">+ Add Product</a>
    </div>
    <div class="admin-toolbar">
      <input type="text" class="admin-search" id="search-input" placeholder="Search products...">
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th></th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr></thead>
        <tbody id="table-body"><tr><td colspan="7">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/admin.js"></script>
<script>
function formatPrice(n) { return '$' + Number(n).toFixed(2).replace(/\.00$/, ''); }
let products = [];

function render(list) {
  const body = document.getElementById('table-body');
  body.innerHTML = list.length ? list.map(p => `
    <tr>
      <td><img class="thumb" src="${Placeholder.productImage('p'+p.id, p.name)}"></td>
      <td>${escapeHTML(p.name)}</td>
      <td class="text-soft">${escapeHTML(p.brand_name)}</td>
      <td class="text-soft">${escapeHTML(p.category_name)}</td>
      <td>${p.discount_price ? `<span class="price-sale">${formatPrice(p.discount_price)}</span>` : formatPrice(p.price)}</td>
      <td>${p.active ? '<span class="status-pill Delivered">Active</span>' : '<span class="status-pill Cancelled">Hidden</span>'}</td>
      <td>
        <a class="table-action-btn" href="/admin/product-edit.html?id=${p.id}">Edit</a>
        <button class="table-action-btn danger js-delete" data-id="${p.id}">Delete</button>
      </td>
    </tr>`).join('') : `<tr><td colspan="7">No products yet. Add your first product to get started.</td></tr>`;

  body.querySelectorAll('.js-delete').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Delete this product permanently?')) return;
    await API.del('/api/admin/products/' + btn.dataset.id);
    Toast.show('Product deleted.');
    load();
  }));
}

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  render(products.filter(p => p.name.toLowerCase().includes(q) || p.brand_name.toLowerCase().includes(q) || p.category_name.toLowerCase().includes(q)));
});

async function load() {
  const user = await adminGuard('products');
  if (!user) return;
  const { products: p } = await API.get('/api/admin/products');
  products = p;
  render(products);
}
load();
</script>
</body>
</html>
