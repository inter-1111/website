<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M3RAFSH — Local Fashion Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..800;1,9..144,500..700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --ink:#15130F;
  --ink-soft:#3A362F;
  --porcelain:#F6F2E9;
  --paper:#FBF9F4;
  --sand:#E6DECB;
  --sand-line:#D8CDB2;
  --brick:#A8431C;
  --brick-dark:#7E3115;
  --teal:#1F5C56;
  --teal-dark:#123D38;
  --gold:#B9873B;
  --ok:#3E6B4A;
  --err:#A23A2E;
  --radius:2px;
  --shadow:0 1px 2px rgba(21,19,15,0.06), 0 8px 24px rgba(21,19,15,0.06);
  --shadow-lg:0 20px 60px rgba(21,19,15,0.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--porcelain); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
#root{min-height:100vh; overflow-x:hidden;}
img,svg{display:block; max-width:100%;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
input,select,textarea{font-family:inherit; font-size:14px;}
::selection{background:var(--brick); color:#fff;}
.serif{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
.eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft);}
.wrap{max-width:1280px; margin:0 auto; padding:0 32px;}
@media(max-width:720px){.wrap{padding:0 18px;}}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 26px; font-size:13px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; border:1px solid var(--ink); border-radius:var(--radius); background:var(--ink); color:var(--paper); transition:all .18s ease; white-space:nowrap;}
.btn:hover{background:var(--brick); border-color:var(--brick);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-outline{background:transparent; color:var(--ink); border:1px solid var(--ink);}
.btn-outline:hover{background:var(--ink); color:var(--paper);}
.btn-ghost{background:transparent; border:1px solid transparent; color:var(--ink);}
.btn-ghost:hover{border-color:var(--sand-line); background:var(--paper);}
.btn-sm{padding:9px 16px; font-size:11.5px;}
.btn-block{width:100%;}
.link-btn{background:none; border:none; text-decoration:underline; text-underline-offset:3px; font-size:13px; color:var(--ink-soft); padding:0;}
.link-btn:hover{color:var(--brick);}

.site-header{position:sticky; top:0; z-index:60; background:rgba(246,242,233,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--sand-line);}
.header-row{display:flex; align-items:center; justify-content:space-between; height:76px; gap:24px;}
.logo{font-family:'Fraunces',serif; font-weight:700; font-size:24px; letter-spacing:0.01em;}
.logo b{color:var(--brick);}
.nav-main{display:flex; align-items:center; gap:30px;}
.nav-main a{font-size:13px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-soft); position:relative; padding:6px 0;}
.nav-main a:hover, .nav-main a.active{color:var(--ink);}
.nav-main a.active:after{content:''; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:var(--brick);}
.nav-icons{display:flex; align-items:center; gap:6px;}
.icon-btn{position:relative; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:none; background:transparent; color:var(--ink);}
.icon-btn:hover{background:var(--sand);}
.badge{position:absolute; top:1px; right:1px; min-width:16px; height:16px; padding:0 3px; border-radius:8px; background:var(--brick); color:#fff; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace;}
.acct-pill{display:flex; align-items:center; gap:8px; padding:6px 14px 6px 6px; border-radius:20px; border:1px solid var(--sand-line); background:var(--paper); font-size:12.5px; font-weight:600;}
.avatar{width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:'Fraunces',serif;}
.hamburger{display:none; width:38px; height:38px; align-items:center; justify-content:center; border:none; background:transparent;}
@media(max-width:900px){.nav-main{display:none;} .hamburger{display:flex;}}

.mobile-drawer{position:fixed; inset:0; z-index:100; display:flex;}
.mobile-drawer .scrim{position:absolute; inset:0; background:rgba(21,19,15,0.45);}
.mobile-drawer .panel{position:relative; margin-left:auto; width:82%; max-width:340px; height:100%; background:var(--paper); padding:26px 24px; overflow-y:auto; animation:slideIn .22s ease;}
@keyframes slideIn{from{transform:translateX(100%)} to{transform:translateX(0)}}
.mobile-drawer a{display:block; padding:14px 0; font-size:16px; font-weight:600; border-bottom:1px solid var(--sand-line);}

.hero{position:relative; background:var(--ink); color:var(--paper); overflow:hidden;}
.hero-inner{position:relative; z-index:2; padding:120px 32px 100px; max-width:1280px; margin:0 auto; display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center;}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr; padding:70px 20px 60px;}}
.hero-eyebrow{color:var(--gold); margin-bottom:22px;}
.hero h1{font-family:'Fraunces',serif; font-weight:340; font-style:italic; font-size:clamp(40px,6vw,78px); line-height:0.98; letter-spacing:-0.01em; margin-bottom:24px;}
.hero h1 b{font-style:normal; font-weight:700; color:var(--gold); display:block;}
.hero p{font-size:16px; color:#D9D3C5; max-width:440px; line-height:1.6; margin-bottom:34px;}
.hero-ctas{display:flex; gap:14px; flex-wrap:wrap;}
.hero .btn{border-color:var(--paper); background:var(--paper); color:var(--ink);}
.hero .btn:hover{background:var(--gold); border-color:var(--gold); color:var(--ink);}
.hero .btn-outline{background:transparent; color:var(--paper); border-color:rgba(251,249,244,0.4);}
.hero .btn-outline:hover{background:rgba(251,249,244,0.1); border-color:var(--paper);}
.hero-visual{position:relative; height:420px; display:flex; align-items:center; justify-content:center;}
@media(max-width:900px){.hero-visual{height:260px;}}
.thread-line{position:absolute; inset:0; opacity:.5;}

.section{padding:88px 0;}
.section-tight{padding:56px 0;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:40px; gap:20px; flex-wrap:wrap;}
.section-head h2{font-family:'Fraunces',serif; font-size:clamp(26px,3.4vw,40px); font-weight:500; letter-spacing:-0.01em;}
.section-head p{color:var(--ink-soft); font-size:14px; max-width:420px; margin-top:6px;}

.cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media(max-width:800px){.cat-grid{grid-template-columns:1fr;}}
.cat-card{position:relative; height:380px; border-radius:var(--radius); overflow:hidden; cursor:pointer; background:var(--ink);}
.cat-card .cg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition:transform .5s ease;}
.cat-card:hover .cg{transform:scale(1.06);}
.cat-card .ov{position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(21,19,15,0.82) 100%);}
.cat-card .lbl{position:absolute; left:22px; bottom:22px; color:#fff; z-index:2;}
.cat-card .lbl .eyebrow{color:var(--gold); margin-bottom:4px;}
.cat-card .lbl h3{font-family:'Fraunces',serif; font-size:30px; font-weight:500;}
.cat-card .arrow{position:absolute; top:20px; right:20px; width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; color:#fff; z-index:2; transition:all .2s;}
.cat-card:hover .arrow{background:var(--gold); border-color:var(--gold);}

.prod-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:26px 22px;}
@media(max-width:1080px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:720px){.prod-grid{grid-template-columns:repeat(2,1fr); gap:18px 12px;}}
.prod-card{cursor:pointer;}
.prod-media{position:relative; aspect-ratio:3/4; background:var(--sand); border-radius:var(--radius); overflow:hidden; margin-bottom:12px;}
.prod-media svg, .prod-media img{position:absolute; inset:0; width:100%; height:100%; transition:transform .45s ease;}
.prod-card:hover .prod-media svg, .prod-card:hover .prod-media img{transform:scale(1.05);}
.prod-tags{position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:6px; z-index:2;}
.tag-chip{font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:4px 8px; border-radius:2px; background:var(--ink); color:#fff;}
.tag-chip.sale{background:var(--brick);}
.fav-btn{position:absolute; top:8px; right:8px; z-index:2; width:32px; height:32px; border-radius:50%; background:rgba(251,249,244,0.92); border:none; display:flex; align-items:center; justify-content:center; transition:transform .15s;}
.fav-btn:hover{transform:scale(1.08);}
.fav-btn.on svg{fill:var(--brick); stroke:var(--brick);}
.quick-add{position:absolute; left:8px; right:8px; bottom:8px; z-index:2; opacity:0; transform:translateY(6px); transition:all .18s;}
.prod-card:hover .quick-add{opacity:1; transform:translateY(0);}
.prod-info .b{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin-bottom:2px;}
.prod-info .n{font-size:14px; font-weight:500; margin-bottom:4px; line-height:1.3;}
.prod-info .price{font-family:'JetBrains Mono',monospace; font-size:13px; display:flex; gap:8px; align-items:center;}
.prod-info .price .strike{text-decoration:line-through; color:var(--ink-soft); font-weight:400;}
.prod-info .price .now{font-weight:600; color:var(--brick);}

.brand-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media(max-width:900px){.brand-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.brand-grid{grid-template-columns:1fr;}}
.brand-card{border:1px solid var(--sand-line); border-radius:var(--radius); overflow:hidden; background:var(--paper); transition:box-shadow .2s;}
.brand-card:hover{box-shadow:var(--shadow);}
.brand-cover{height:180px; position:relative; overflow:hidden;}
.brand-cover svg{width:100%; height:100%;}
.brand-body{padding:20px;}
.brand-logo-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.brand-mark{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:#fff; font-size:15px;}
.brand-body h3{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
.brand-body p{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:8px 0 14px;}
.brand-count{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);}

.promo{background:var(--teal); color:var(--paper); border-radius:var(--radius); padding:56px 48px; display:flex; align-items:center; justify-content:space-between; gap:30px; flex-wrap:wrap;}
.promo h3{font-family:'Fraunces',serif; font-style:italic; font-weight:400; font-size:clamp(24px,3vw,36px);}
.promo .btn{background:var(--paper); color:var(--teal); border-color:var(--paper);}
.promo .btn:hover{background:var(--gold); border-color:var(--gold); color:var(--ink);}

.newsletter{background:var(--sand); border-radius:var(--radius); padding:60px 48px; text-align:center;}
.newsletter h3{font-family:'Fraunces',serif; font-size:30px; margin-bottom:10px;}
.newsletter p{color:var(--ink-soft); margin-bottom:26px; font-size:14px;}
.nl-form{display:flex; gap:10px; max-width:420px; margin:0 auto;}
.nl-form input{flex:1; padding:13px 16px; border:1px solid var(--ink); border-radius:2px; background:var(--paper);}

.site-footer{background:var(--ink); color:#B9B3A3; padding:64px 0 26px; margin-top:60px;}
.foot-grid{display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:30px; margin-bottom:50px;}
@media(max-width:800px){.foot-grid{grid-template-columns:1fr 1fr;}}
.foot-grid h4{color:#fff; font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:16px;}
.foot-grid a, .foot-grid li{display:block; font-size:13px; padding:6px 0; color:#B9B3A3;}
.foot-grid a:hover{color:#fff;}
.foot-bottom{border-top:1px solid #33302A; padding-top:22px; display:flex; justify-content:space-between; font-size:12px; flex-wrap:wrap; gap:10px;}
.foot-bottom .link-btn{color:#8B8677;}

.crumbs{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ink-soft); margin-bottom:24px; flex-wrap:wrap;}
.crumbs a:hover{color:var(--brick); text-decoration:underline;}
.crumbs span{opacity:.5;}

.shop-head{padding-top:40px;}
.shop-layout{display:grid; grid-template-columns:230px 1fr; gap:36px; align-items:flex-start;}
@media(max-width:860px){.shop-layout{grid-template-columns:1fr;}}
.filter-box{border:1px solid var(--sand-line); border-radius:var(--radius); padding:18px; margin-bottom:14px; background:var(--paper);}
.filter-box h5{font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; color:var(--ink-soft); font-weight:700;}
.filter-opt{display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13.5px; cursor:pointer;}
.filter-opt input{accent-color:var(--brick); width:15px; height:15px;}
.swatch-row{display:flex; flex-wrap:wrap; gap:8px;}
.swatch{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--sand-line); cursor:pointer; position:relative;}
.swatch.sel{outline:2px solid var(--ink); outline-offset:2px;}
.range-row{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11.5px; margin-top:8px;}
.shop-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:14px; flex-wrap:wrap;}
.result-count{font-size:13px; color:var(--ink-soft);}
.sort-select{padding:9px 12px; border:1px solid var(--sand-line); border-radius:2px; background:var(--paper); font-size:12.5px;}
.searchbar{display:flex; align-items:center; gap:10px; border:1px solid var(--ink); border-radius:2px; padding:10px 14px; margin-bottom:22px; background:var(--paper);}
.searchbar input{flex:1; border:none; outline:none; background:transparent; font-size:14px;}
.empty-state{padding:70px 20px; text-align:center; color:var(--ink-soft);}
.empty-state h3{font-family:'Fraunces',serif; font-size:22px; color:var(--ink); margin-bottom:8px;}

.pdp{display:grid; grid-template-columns:1fr 460px; gap:56px; padding-top:36px;}
@media(max-width:960px){.pdp{grid-template-columns:1fr; gap:30px;}}
.pdp-gallery-main{aspect-ratio:4/5; background:var(--sand); border-radius:var(--radius); overflow:hidden; margin-bottom:12px; cursor:zoom-in; position:relative;}
.pdp-gallery-main svg, .pdp-gallery-main img{width:100%; height:100%; object-fit:cover;}
.pdp-thumbs{display:flex; gap:10px;}
.pdp-thumb{width:70px; height:88px; border-radius:2px; overflow:hidden; border:2px solid transparent; cursor:pointer; background:var(--sand); position:relative;}
.pdp-thumb img{width:100%; height:100%; object-fit:cover;}
.pdp-thumb.sel{border-color:var(--ink);}
.pdp-side .brand-link{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); margin-bottom:8px; display:inline-block;}
.pdp-side h1{font-family:'Fraunces',serif; font-size:30px; font-weight:500; margin-bottom:10px; line-height:1.15;}
.pdp-price{font-family:'JetBrains Mono',monospace; font-size:19px; margin-bottom:18px; display:flex; gap:10px; align-items:center;}
.pdp-price .strike{text-decoration:line-through; color:var(--ink-soft); font-weight:400; font-size:15px;}
.pdp-price .now{color:var(--brick); font-weight:700;}
.pdp-desc{font-size:14px; line-height:1.7; color:var(--ink-soft); margin-bottom:26px;}
.opt-block{margin-bottom:22px;}
.opt-label{display:flex; justify-content:space-between; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
.opt-label button{font-weight:500; text-transform:none; text-decoration:underline; background:none; border:none; font-size:12.5px; color:var(--ink-soft);}
.size-row{display:flex; flex-wrap:wrap; gap:8px;}
.size-chip{min-width:44px; padding:9px 12px; border:1px solid var(--sand-line); border-radius:2px; font-size:12.5px; font-weight:600; text-align:center; cursor:pointer; background:var(--paper);}
.size-chip.sel{border-color:var(--ink); background:var(--ink); color:#fff;}
.size-chip.oos{opacity:.35; text-decoration:line-through; cursor:not-allowed;}
.qty-row{display:flex; align-items:center; border:1px solid var(--sand-line); border-radius:2px; width:fit-content;}
.qty-row button{width:38px; height:38px; background:none; border:none; font-size:16px;}
.qty-row span{width:34px; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:600;}
.pdp-actions{display:flex; gap:10px; margin-bottom:24px;}
.stock-note{font-size:12.5px; margin-bottom:20px; display:flex; align-items:center; gap:6px;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
.dot.low{background:var(--gold);}
.accordion{border-top:1px solid var(--sand-line);}
.acc-item{border-bottom:1px solid var(--sand-line);}
.acc-head{display:flex; justify-content:space-between; align-items:center; padding:16px 0; cursor:pointer; font-size:13px; font-weight:600;}
.acc-body{padding-bottom:16px; font-size:13px; color:var(--ink-soft); line-height:1.65;}

.related-strip{display:flex; gap:20px; overflow-x:auto; padding-bottom:8px;}
.related-strip .prod-card{min-width:220px;}

.drawer-scrim{position:fixed; inset:0; background:rgba(21,19,15,0.45); z-index:120;}
.drawer{position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:var(--paper); z-index:121; display:flex; flex-direction:column; animation:slideIn .24s ease;}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:22px 24px; border-bottom:1px solid var(--sand-line);}
.drawer-head h3{font-family:'Fraunces',serif; font-size:20px;}
.drawer-body{flex:1; overflow-y:auto; padding:14px 24px;}
.cart-line{display:grid; grid-template-columns:74px 1fr; gap:14px; padding:16px 0; border-bottom:1px solid var(--sand-line);}
.cart-line .cimg{width:74px; height:92px; border-radius:2px; overflow:hidden; background:var(--sand); position:relative;}
.cimg img{width:100%; height:100%; object-fit:cover;}
.cart-line .cname{font-size:13.5px; font-weight:600; margin-bottom:2px;}
.cart-line .cbrand{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.cart-line .cmeta{font-size:12px; color:var(--ink-soft); margin:4px 0;}
.cart-line .crow{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
.cart-line .cprice{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;}
.cart-actions-row{display:flex; gap:14px; font-size:12px;}
.drawer-foot{border-top:1px solid var(--sand-line); padding:20px 24px 26px; background:var(--paper);}
.sum-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0;}
.sum-row.total{font-weight:700; font-size:16px; padding-top:12px; border-top:1px solid var(--sand-line); margin-top:8px;}

.auth-scrim{position:fixed; inset:0; background:rgba(21,19,15,0.5); z-index:150; display:flex; align-items:center; justify-content:center; padding:20px;}
.auth-card{background:var(--paper); width:440px; max-width:100%; border-radius:var(--radius); padding:42px 38px; box-shadow:var(--shadow-lg); max-height:92vh; overflow-y:auto;}
.auth-card h2{font-family:'Fraunces',serif; font-size:26px; margin-bottom:6px;}
.auth-card .sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:7px; color:var(--ink-soft);}
.field input, .field select, .field textarea{width:100%; padding:12px 14px; border:1px solid var(--sand-line); border-radius:2px; background:#fff;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal);}
.field .err-text{color:var(--err); font-size:11.5px; margin-top:5px;}
.field.has-err input{border-color:var(--err);}
.check-row{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:20px;}
.check-row input{accent-color:var(--brick); width:15px; height:15px;}

const STORAGE_KEY = 'm3rafsh-app-state-v1';
async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveState(state){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ }
}

const SEED_ACCOUNTS = [
  {id:'u1', name:'Nourhan Adel', email:'nourhan.adel@example.com', phone:'+20 100 123 4567', status:'active', joined:'2026-02-11'},
  {id:'u2', name:'Youssef Kamal', email:'youssef.kamal@example.com', phone:'+20 111 987 6543', status:'active', joined:'2026-03-02'},
  {id:'u3', name:'Salma Reda', email:'salma.reda@example.com', phone:'+20 122 456 7891', status:'banned', joined:'2026-01-20'},
];

function App(){
  const [route, setRoute] = useState({page:'home', params:{}});
  const [history, setHistory] = useState([]);
  const [cart, setCart] = useState([]);
  const [wishlist, setWishlist] = useState([]);
  const [user, setUser] = useState(null);
  const [addresses, setAddresses] = useState([]);
  const [paymentMethods, setPaymentMethods] = useState([]);
  const [orders, setOrders] = useState([]);
  const [recentlyViewed, setRecentlyViewed] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [authOpen, setAuthOpen] = useState(false);
  const [authMode, setAuthMode] = useState('login');
  const [authIntent, setAuthIntent] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [aiOpen, setAiOpen] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [accounts, setAccounts] = useState(SEED_ACCOUNTS);
  const [adminAuthed, setAdminAuthed] = useState(false);
  const [catalogVersion, setCatalogVersion] = useState(0);
  const [productAdds, setProductAdds] = useState([]);
  const [productEdits, setProductEdits] = useState({});
  const [productDeletes, setProductDeletes] = useState([]);
  const [brandAdds, setBrandAdds] = useState([]);
  const [brandEdits, setBrandEdits] = useState({});
  const [brandDeletes, setBrandDeletes] = useState([]);

  useEffect(()=>{
    (async ()=>{
      const s = await loadState();
      if(s){
        setCart(s.cart||[]);
        setWishlist(s.wishlist||[]);
        setUser(s.user||null);
        setAddresses(s.addresses||[]);
        setPaymentMethods(s.paymentMethods||[]);
        setOrders(s.orders||[]);
        setRecentlyViewed(s.recentlyViewed||[]);
        setAccounts(s.accounts && s.accounts.length ? s.accounts : SEED_ACCOUNTS);

        const bAdds = s.brandAdds || [];
        const bEdits = s.brandEdits || {};
        const bDels = s.brandDeletes || [];
        bAdds.forEach(brandAdd);
        Object.keys(bEdits).forEach(id=>brandUpdate(id, bEdits[id]));
        bDels.forEach(brandRemove);
        setBrandAdds(bAdds);
        setBrandEdits(bEdits);
        setBrandDeletes(bDels);

        const adds = s.productAdds || [];
        const edits = s.productEdits || {};
        const dels = s.productDeletes || [];
        adds.forEach(catalogAdd);
        Object.keys(edits).forEach(id=>catalogUpdate(id, edits[id]));
        dels.forEach(catalogRemove);
        catalogBumpPid(PRODUCTS);
        setProductAdds(adds);
        setProductEdits(edits);
        setProductDeletes(dels);
        setCatalogVersion(v=>v+1);
      }
      setLoaded(true);
    })();
  },[]);
  useEffect(()=>{
    if(!loaded) return;
    saveState({cart,wishlist,user,addresses,paymentMethods,orders,recentlyViewed,accounts,productAdds,productEdits,productDeletes,brandAdds,brandEdits,brandDeletes});
  },[cart,wishlist,user,addresses,paymentMethods,orders,recentlyViewed,accounts,productAdds,productEdits,productDeletes,brandAdds,brandEdits,brandDeletes,loaded]);

  useEffect(()=>{
    if(!user) return;
    const acc = accounts.find(a=>a.email.toLowerCase()===user.email.toLowerCase());
    if(acc && acc.status==='banned'){
      setUser(null);
      pushToast('Your account has been suspended. Contact support for help.');
      goTo('home');
    }
  },[accounts]);

  function pushToast(msg, actionLabel, actionFn){
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,actionLabel,actionFn}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3600);
  }

  function goTo(page, params){
    params = params || {};
    setHistory(h=>[...h, route]);
    setRoute({page, params});
    setMobileNavOpen(false);
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  }
  function goBack(){
    setHistory(h=>{
      if(h.length===0){ setRoute({page:'home',params:{}}); return h; }
      const prev = h[h.length-1];
      setRoute(prev);
      return h.slice(0,-1);
    });
  }

  function requireAuth(nextPage, nextParams){
    setAuthIntent({page:nextPage, params:nextParams||{}});
    setAuthMode('login');
    setAuthOpen(true);
  }

  function addToCart(product, size, color, qty){
    setCart(c=>{
      const idx = c.findIndex(l=>l.productId===product.id && l.size===size && l.color===color);
      if(idx>-1){ const copy=[...c]; copy[idx]={...copy[idx], qty:copy[idx].qty+qty}; return copy; }
      return [...c, {productId:product.id, size, color, qty, savedForLater:false}];
    });
    pushToast('✓ Added to cart', 'View cart', ()=>setCartOpen(true));
  }
  function updateCartQty(idx, qty){
    setCart(c=>{ const copy=[...c]; if(qty<=0){ copy.splice(idx,1);} else { copy[idx]={...copy[idx],qty}; } return copy; });
  }
  function removeCartLine(idx){ setCart(c=>c.filter((_,i)=>i!==idx)); }
  function toggleSaveForLater(idx){ setCart(c=>{const copy=[...c]; copy[idx]={...copy[idx], savedForLater:!copy[idx].savedForLater}; return copy;}); }

  function toggleWishlist(productId){
    setWishlist(w=>{
      if(w.includes(productId)){ pushToast('Removed from saved items'); return w.filter(id=>id!==productId); }
      pushToast('Saved to your wishlist'); return [...w, productId];
    });
  }

  const cartActiveLines = cart.filter(l=>!l.savedForLater);
  const cartCount = cartActiveLines.reduce((s,l)=>s+l.qty,0);

  function handleCheckoutClick(){
    if(cartActiveLines.length===0){ pushToast('Your cart is empty'); return; }
    if(!user){ setCartOpen(false); requireAuth('checkout'); return; }
    setCartOpen(false);
    goTo('checkout');
  }

  function handleAuthSuccess(u){
    const existing = accounts.find(a=>a.email.toLowerCase()===u.email.toLowerCase());
    if(existing && existing.status==='banned'){
      pushToast('This account has been suspended. Contact support for help.');
      return;
    }
    if(!existing){
      setAccounts(a=>[...a, {id:'u'+Date.now(), name:u.name, email:u.email, phone:u.phone||'', status:'active', joined:new Date().toISOString().slice(0,10)}]);
    }
    setUser(u);
    setAuthOpen(false);
    pushToast('Welcome, '+u.name.split(' ')[0]+'!');
    if(authIntent){ goTo(authIntent.page, authIntent.params); setAuthIntent(null); }
  }
  function handleLogout(){
    setUser(null);
    pushToast('Logged out');
    goTo('home');
  }

  function placeOrder(details){
    const items = cartActiveLines.map(l=>{
      const p = PRODUCTS.find(x=>x.id===l.productId);
      return {productId:p.id, name:p.name, brand:p.brand, category:p.category, size:l.size, color:l.color, qty:l.qty, price:finalPrice(p)};
    });
    const subtotal = items.reduce((s,i)=>s+i.price*i.qty,0);
    const shipping = details.shippingCost || 0;
    const order = {
      id: 'M3-'+Math.floor(10000+Math.random()*89999),
      date: new Date().toISOString(),
      items, subtotal, shipping, total: subtotal+shipping,
      address: details.address, payment: details.payment, deliveryMethod: details.deliveryMethod,
      status:'Processing', customerEmail: user?.email || '', customerName: user?.name || '',
    };
    setOrders(o=>[order, ...o]);
    setCart(c=>c.filter(l=>l.savedForLater));
    return order;
  }

  function updateOrderStatus(orderId, status, reason){
    setOrders(os => os.map(o => o.id===orderId ? {
      ...o, status,
      cancelReason: status==='Cancelled' ? (reason ?? o.cancelReason ?? '') : o.cancelReason,
    } : o));
    pushToast(status==='Cancelled' ? 'Order cancelled' : 'Order status updated to '+status);
  }

  function recordView(productId){
    setRecentlyViewed(rv=>{
      const filtered = rv.filter(id=>id!==productId);
      return [productId, ...filtered].slice(0,8);
    });
  }

  function handleAdminLogin(username, password){
    if(username==='admin' && password==='12345'){
      setAdminAuthed(true);
      pushToast('Welcome back, admin');
      return true;
    }
    pushToast('Invalid admin credentials');
    return false;
  }
  function handleAdminLogout(){
    setAdminAuthed(false);
    pushToast('Admin logged out');
    goTo('home');
  }

  function adminAddProduct(fields){
    const product = {id:'p'+(_pid++), image:null, tags:[], discount:0, ...fields};
    catalogAdd(product);
    setProductAdds(a=>[...a, product]);
    setCatalogVersion(v=>v+1);
    pushToast('Product added');
  }
  function adminUpdateProduct(id, fields){
    catalogUpdate(id, fields);
    setProductEdits(e=>({...e, [id]:{...(e[id]||{}), ...fields}}));
    setCatalogVersion(v=>v+1);
    pushToast('Product updated');
  }
  function adminDeleteProduct(id){
    catalogRemove(id);
    setProductAdds(a=>a.filter(p=>p.id!==id));
    setProductEdits(e=>{ const c={...e}; delete c[id]; return c; });
    setProductDeletes(d=>[...d, id]);
    setCatalogVersion(v=>v+1);
    pushToast('Product removed');
  }

  function adminAddBrand(fields){
    const id = slugify(fields.name);
    const brand = {color:'#3A362F', desc:'', image:null, ...fields, id};
    brandAdd(brand);
    setBrandAdds(a=>[...a, brand]);
    setCatalogVersion(v=>v+1);
    pushToast('Brand added');
  }
  function adminUpdateBrand(id, fields){
    brandUpdate(id, fields);
    setBrandEdits(e=>({...e, [id]:{...(e[id]||{}), ...fields}}));
    setCatalogVersion(v=>v+1);
    pushToast('Brand updated');
  }
  function adminDeleteBrand(id){
    const orphaned = PRODUCTS.filter(p=>p.brandId===id).map(p=>p.id);
    orphaned.forEach(catalogRemove);
    brandRemove(id);
    setProductAdds(a=>a.filter(p=>!orphaned.includes(p.id)));
    setProductEdits(e=>{ const c={...e}; orphaned.forEach(pid=>delete c[pid]); return c; });
    setProductDeletes(d=>[...d, ...orphaned]);
    setBrandAdds(a=>a.filter(b=>b.id!==id));
    setBrandEdits(e=>{ const c={...e}; delete c[id]; return c; });
    setBrandDeletes(d=>[...d, id]);
    setCatalogVersion(v=>v+1);
    pushToast('Brand removed');
  }

  function adminUpdateAccount(id, fields){
    setAccounts(a=>a.map(x=>x.id===id ? {...x, ...fields} : x));
    pushToast('Account updated');
  }
  function adminToggleBan(id){
    setAccounts(a=>a.map(x=>x.id===id ? {...x, status: x.status==='banned' ? 'active' : 'banned'} : x));
  }
  function adminDeleteAccount(id){
    setAccounts(a=>a.filter(x=>x.id!==id));
    pushToast('Account deleted');
  }

  const ctx = {
    route, goTo, goBack, cart, cartActiveLines, cartCount, wishlist, user, addresses, setAddresses,
    paymentMethods, setPaymentMethods, orders, recentlyViewed, cartOpen, setCartOpen, authOpen, setAuthOpen,
    authMode, setAuthMode, mobileNavOpen, setMobileNavOpen, addToCart, updateCartQty, removeCartLine,
    toggleSaveForLater, toggleWishlist, handleCheckoutClick, requireAuth, handleAuthSuccess, handleLogout,
    placeOrder, updateOrderStatus, recordView, pushToast, aiOpen, setAiOpen, catalogVersion,
    adminAuthed, handleAdminLogin, handleAdminLogout,
    adminAddProduct, adminUpdateProduct, adminDeleteProduct,
    adminAddBrand, adminUpdateBrand, adminDeleteBrand,
    accounts, adminUpdateAccount, adminToggleBan, adminDeleteAccount,
  };

  return (
    <div>
      <Header ctx={ctx}/>
      <MobileDrawer ctx={ctx}/>
      <main>
        <Page ctx={ctx}/>
      </main>
      <Footer ctx={ctx}/>
      {ctx.cartOpen && <CartDrawer ctx={ctx}/>}
      {ctx.authOpen && <AuthModal ctx={ctx}/>}
      <ToastStack toasts={toasts}/>
      <AiAssistant ctx={ctx}/>
    </div>
  );
}

function Shop({ctx}){
  const {route, goTo} = ctx;
  const p = route.params||{};
  const [query, setQuery] = useState(p.query||'');
  const [genderF, setGenderF] = useState(p.gender ? [p.gender] : []);
  const [catF, setCatF] = useState(p.category ? [p.category] : []);
  const [brandF, setBrandF] = useState(p.brandId ? [p.brandId] : []);
  const [colorF, setColorF] = useState([]);
  const [sizeF, setSizeF] = useState([]);
  const [maxPrice, setMaxPrice] = useState(3000);
  const [inStockOnly, setInStockOnly] = useState(false);
  const [sort, setSort] = useState('featured');
  const searchRef = useRef(null);

  useEffect(()=>{
    setGenderF(p.gender?[p.gender]:[]);
    setCatF(p.category?[p.category]:[]);
    setBrandF(p.brandId?[p.brandId]:[]);
    if(p.query!==undefined) setQuery(p.query);
    if(p.focusSearch && searchRef.current) setTimeout(()=>searchRef.current.focus(),50);
  },[route]);

  const allCats = useMemo(()=>{
    const s = new Set();
    Object.values(CATEGORIES).forEach(list=>list.forEach(c=>s.add(c)));
    return Array.from(s);
  },[]);

  let results = PRODUCTS.filter(prod=>{
    if(genderF.length && !genderF.includes(prod.gender)) return false;
    if(catF.length && !catF.includes(prod.category)) return false;
    if(brandF.length && !brandF.includes(prod.brandId)) return false;
    if(colorF.length && !prod.colors.some(c=>colorF.includes(c.name))) return false;
    if(sizeF.length && !prod.sizes.some(s=>sizeF.includes(s))) return false;
    if(finalPrice(prod) > maxPrice) return false;
    if(inStockOnly && prod.stock<=0) return false;
    if(p.tag && !prod.tags.includes(p.tag)) return false;
    if(query){
      const q = query.toLowerCase();
      const hay = (prod.name+' '+prod.brand+' '+prod.category+' '+prod.desc).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  results = results.slice().sort((a,b)=>{
    if(sort==='newest') return (b.tags.includes('new')?1:0)-(a.tags.includes('new')?1:0);
    if(sort==='popular') return (b.tags.includes('trending')?1:0)-(a.tags.includes('trending')?1:0);
    if(sort==='price-asc') return finalPrice(a)-finalPrice(b);
    if(sort==='price-desc') return finalPrice(b)-finalPrice(a);
    return 0;
  });

  const allColors = useMemo(()=>{
    const m = new Map();
    PRODUCTS.forEach(prod=>prod.colors.forEach(c=>m.set(c.name,c.hex)));
    return Array.from(m.entries());
  },[]);

  function toggle(setFn, list, val){
    setFn(list.includes(val) ? list.filter(x=>x!==val) : [...list, val]);
  }

  const title = p.gender ? (p.gender==='unisex'?'Unisex':p.gender[0].toUpperCase()+p.gender.slice(1))
    : p.tag==='new' ? 'New Arrivals' : p.tag==='sale' ? 'Sale' : 'Shop All';

  return (
    <div className="wrap shop-head">
      <div className="crumbs">
        <a href="#" onClick={e=>{e.preventDefault(); ctx.goTo('home');}}>Home</a><span>/</span>
        <span style={{color:'var(--ink)'}}>{title}</span>
      </div>
      <div className="section-head" style={{marginBottom:20}}>
        <h2>{title}</h2>
      </div>
      <div className="searchbar">
        <Icon.search width="17" height="17"/>
        <input ref={searchRef} placeholder="Search products, brands, categories…" value={query} onChange={e=>setQuery(e.target.value)}/>
        {query && <button className="icon-btn" onClick={()=>setQuery('')}><Icon.close width="15" height="15"/></button>}
      </div>
      <div className="shop-layout">
        <aside>
          <div className="filter-box">
            <h5>Gender</h5>
            {['men','women','unisex'].map(g=>(
              <label key={g} className="filter-opt"><input type="checkbox" checked={genderF.includes(g)} onChange={()=>toggle(setGenderF,genderF,g)}/> <span style={{textTransform:'capitalize'}}>{g==='unisex'?'Unisex':g}</span></label>
            ))}
          </div>
          <div className="filter-box">
            <h5>Category</h5>
            {allCats.map(c=>(
              <label key={c} className="filter-opt"><input type="checkbox" checked={catF.includes(c)} onChange={()=>toggle(setCatF,catF,c)}/> {c}</label>
            ))}
          </div>
          <div className="filter-box">
            <h5>Brand</h5>
            {BRAND_DEFS.map(b=>(
              <label key={b.id} className="filter-opt"><input type="checkbox" checked={brandF.includes(b.id)} onChange={()=>toggle(setBrandF,brandF,b.id)}/> {b.name}</label>
            ))}
          </div>
          <div className="filter-box">
            <h5>Color</h5>
            <div className="swatch-row">
              {allColors.map(([name,hex])=>(
                <span key={name} title={name} className={'swatch'+(colorF.includes(name)?' sel':'')} style={{background:hex}} onClick={()=>toggle(setColorF,colorF,name)}/>
              ))}
            </div>
          </div>
          <div className="filter-box">
            <h5>Size</h5>
            <div className="size-row">
              {['XS','S','M','L','XL','28','30','32','34','36','One Size'].map(s=>(
                <span key={s} className={'size-chip'+(sizeF.includes(s)?' sel':'')} style={{minWidth:'auto'}} onClick={()=>toggle(setSizeF,sizeF,s)}>{s}</span>
              ))}
            </div>
          </div>
          <div className="filter-box">
            <h5>Price</h5>
            <input type="range" min="300" max="3000" step="50" value={maxPrice} onChange={e=>setMaxPrice(Number(e.target.value))} style={{width:'100%'}}/>
            <div className="range-row"><span>300 EGP</span><span>Up to {fmt(maxPrice)}</span></div>
          </div>
          <div className="filter-box">
            <label className="filter-opt"><input type="checkbox" checked={inStockOnly} onChange={e=>setInStockOnly(e.target.checked)}/> In stock only</label>
          </div>
        </aside>
        <div>
          <div className="shop-toolbar">
            <span className="result-count">{results.length} results</span>
            <select className="sort-select" value={sort} onChange={e=>setSort(e.target.value)}>
              <option value="featured">Sort: Featured</option>
              <option value="newest">Newest</option>
              <option value="popular">Most Popular</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
          {results.length===0 ? (
            <div className="empty-state">
              <h3>No products match those filters</h3>
              <p>Try widening your price range or clearing a filter.</p>
            </div>
          ) : (
            <div className="prod-grid">
              {results.map(prod=> <ProductCard key={prod.id} p={prod} ctx={ctx}/>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

              <button onClick={()=>setQty(q=>Math.min(p.stock,q+1))}><Icon.plus width="14" height="14"/></button>
            </div>
          </div>

          <div className="stock-note"><span className={'dot'+(p.stock<8?' low':'')}/> {p.stock<8 ? `Only ${p.stock} left in stock` : 'In stock'}</div>

          <div className="pdp-actions">
            <button className="btn btn-block" onClick={handleAdd} disabled={p.stock<=0}>{p.stock<=0?'Out of Stock':'Add to Cart'}</button>
            <button className={'btn btn-outline'+(isFav?'':'')} onClick={()=>toggleWishlist(p.id)} aria-label="Save" style={{minWidth:52}}>
              <Icon.heart width="17" height="17" style={isFav?{fill:'var(--brick)',stroke:'var(--brick)'}:{}}/>
            </button>
          </div>

          <div className="accordion">
            {[
              ['shipping','Shipping information','Orders ship within 2–4 business days from the brand\u2019s local studio. Standard delivery takes 3–6 days; express options are available at checkout.'],
              ['returns','Returns','Unworn items with tags attached can be returned within 14 days of delivery for a full refund to your original payment method.'],
              ['care','Materials & care','Made from '+ (p.category==='Knitwear' ? 'a regional cotton-wool blend — hand wash cold, dry flat.' : 'considered natural-leaning fabrics — check the care label for full instructions.'),],
            ].map(([key,title,body])=>(
              <div className="acc-item" key={key}>
                <div className="acc-head" onClick={()=>setOpenAcc(openAcc===key?null:key)}>
                  <span>{title}</span>
                  <Icon.chevDown width="16" height="16" style={{transform:openAcc===key?'rotate(180deg)':'none', transition:'transform .2s'}}/>
                </div>
                {openAcc===key && <div className="acc-body">{body}</div>}
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="section">
        <div className="section-head"><h2>You may also like</h2></div>
        <div className="related-strip">{related.map(r=> <ProductCard key={r.id} p={r} ctx={ctx}/>)}</div>
      </div>
      <div className="section" style={{paddingTop:0}}>
        <div className="section-head"><h2>Recommended for you</h2></div>
        <div className="related-strip">{recommended.map(r=> <ProductCard key={r.id} p={r} ctx={ctx}/>)}</div>
      </div>
      {recentlyViewed.filter(id=>id!==p.id).length>0 && (
        <div className="section" style={{paddingTop:0}}>
          <div className="section-head"><h2>Recently viewed</h2></div>
          <div className="related-strip">
            {recentlyViewed.filter(id=>id!==p.id).map(id=>PRODUCTS.find(x=>x.id===id)).filter(Boolean).map(r=> <ProductCard key={r.id} p={r} ctx={ctx}/>)}
          </div>
        </div>
      )}
      {zoom && (
        <div className="zoom-scrim" onClick={()=>setZoom(false)}>
          <svg viewBox="0 0 120 170" style={{width:420, height:594}}>
            <GarmentArt category={p.category} image={p.image} big/>
          </svg>
        </div>
      )}
    </div>
  );
}

function CartLine({line, idx, ctx}){
  const p = PRODUCTS.find(x=>x.id===line.productId);
  if(!p) return null;
  const b = brandOf(p);
  return (
    <div className="cart-line">
      <div className="cimg"><GarmentArt category={p.category} image={p.image}/></div>
      <div>
        <div className="cbrand">{p.brand}</div>
        <div className="cname">{p.name}</div>
        <div className="cmeta">{line.color} · {line.size}</div>
        <div className="crow">
          <div className="qty-row" style={{transform:'scale(0.85)', transformOrigin:'left center'}}>
            <button onClick={()=>ctx.updateCartQty(idx, line.qty-1)}><Icon.minus width="12" height="12"/></button>
            <span>{line.qty}</span>
            <button onClick={()=>ctx.updateCartQty(idx, line.qty+1)}><Icon.plus width="12" height="12"/></button>
          </div>
          <span className="cprice">{fmt(finalPrice(p)*line.qty)}</span>
        </div>
        <div className="cart-actions-row" style={{marginTop:8}}>
          <button className="link-btn" onClick={()=>ctx.removeCartLine(idx)}>Remove</button>
          <button className="link-btn" onClick={()=>ctx.toggleSaveForLater(idx)}>{line.savedForLater?'Move to cart':'Save for later'}</button>
        </div>
      </div>
    </div>
  );
}

function CartDrawer({ctx}){
  const {cart, setCartOpen, goTo, handleCheckoutClick} = ctx;
  const active = cart.filter(l=>!l.savedForLater);
  const saved = cart.filter(l=>l.savedForLater);
  const subtotal = active.reduce((s,l)=>{ const p=PRODUCTS.find(x=>x.id===l.productId); return s + (p?finalPrice(p)*l.qty:0); },0);
  const shipping = subtotal>1500 || subtotal===0 ? 0 : 90;
  const total = subtotal+shipping;
  return (
    <React.Fragment>
      <div className="drawer-scrim" onClick={()=>setCartOpen(false)}/>
      <div className="drawer">
        <div className="drawer-head">
          <h3>Your Cart {active.length>0?`(${active.reduce((s,l)=>s+l.qty,0)})`:''}</h3>
          <button className="icon-btn" onClick={()=>setCartOpen(false)}><Icon.close width="20" height="20"/></button>
        </div>
        <div className="drawer-body">
          {active.length===0 && saved.length===0 && (
            <div className="empty-state">
              <h3>Your cart is empty</h3>
              <p>Browse the shop to find something you'll love.</p>
              <div style={{marginTop:20}}><button className="btn" onClick={()=>{setCartOpen(false); goTo('shop',{});}}>Continue Shopping</button></div>
            </div>
          )}
          {active.map((l,i)=>{
            const realIdx = cart.indexOf(l);
            return <CartLine key={i} line={l} idx={realIdx} ctx={ctx}/>;
          })}
          {saved.length>0 && (
            <div style={{marginTop:20}}>
              <div className="eyebrow" style={{marginBottom:8}}>Saved for later ({saved.length})</div>
              {saved.map((l,i)=>{ const realIdx = cart.indexOf(l); return <CartLine key={i} line={l} idx={realIdx} ctx={ctx}/>; })}
            </div>
          )}
        </div>
        {active.length>0 && (
          <div className="drawer-foot">
            <div className="sum-row"><span>Subtotal</span><span className="mono">{fmt(subtotal)}</span></div>
            <div className="sum-row"><span>Shipping</span><span className="mono">{shipping===0?'Free':fmt(shipping)}</span></div>
            <div className="sum-row total"><span>Estimated total</span><span className="mono">{fmt(total)}</span></div>
            <div style={{display:'flex', flexDirection:'column', gap:10, marginTop:16}}>
              <button className="btn btn-block" onClick={handleCheckoutClick}>Proceed to Checkout</button>
              <button className="btn btn-outline btn-block" onClick={()=>{setCartOpen(false); goTo('shop',{});}}>Continue Shopping</button>
            </div>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

function AuthModal({ctx}){
  const {authMode, setAuthMode, setAuthOpen, handleAuthSuccess, authIntent} = ctx;
  const isSignup = authMode==='signup';
  const [form, setForm] = useState({name:'',email:'',password:'',confirm:'',phone:'',terms:false, remember:false});
  const [errs, setErrs] = useState({});

  function submit(e){
    e.preventDefault();
    const newErrs = {};
    if(isSignup && !form.name.trim()) newErrs.name = 'Enter your name';
    if(!form.email.trim() || !form.email.includes('@')) newErrs.email = 'Enter a valid email';
    if(!form.password || form.password.length<4) newErrs.password = 'Password must be at least 4 characters';
    if(isSignup && form.confirm!==form.password) newErrs.confirm = 'Passwords do not match';
    if(isSignup && !form.terms) newErrs.terms = 'You must accept the terms to continue';
    setErrs(newErrs);
    if(Object.keys(newErrs).length) return;
    handleAuthSuccess({name: isSignup ? form.name : form.email.split('@')[0].replace(/\./g,' '), email: form.email, phone: form.phone});
  }

  return (
    <div className="auth-scrim" onClick={(e)=>{ if(e.target===e.currentTarget) setAuthOpen(false); }}>
      <div className="auth-card">
        <button className="auth-close icon-btn" onClick={()=>setAuthOpen(false)}><Icon.close width="18" height="18"/></button>
        {authIntent?.page==='checkout' && (
          <div className="eyebrow" style={{color:'var(--teal)', marginBottom:14}}>Your cart is ready — log in to continue to checkout</div>
        )}
        <h2>{isSignup?'Create your account':'Welcome back'}</h2>
        <p className="sub">{isSignup?'Join M3RAFSH to check out, track orders and save your favorites.':'Log in to continue to checkout.'}</p>
        <form onSubmit={submit}>
          {isSignup && (
            <div className={'field'+(errs.name?' has-err':'')}>
              <label>Full name</label>
              <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
              {errs.name && <div className="err-text">{errs.name}</div>}
            </div>
          )}
          <div className={'field'+(errs.email?' has-err':'')}>
            <label>Email</label>
            <input type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/>
            {errs.email && <div className="err-text">{errs.email}</div>}
          </div>
          <div className={'field'+(errs.password?' has-err':'')}>
            <label>Password</label>
            <input type="password" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))}/>
            {errs.password && <div className="err-text">{errs.password}</div>}
          </div>
          {isSignup && (
            <div className={'field'+(errs.confirm?' has-err':'')}>
              <label>Confirm password</label>
              <input type="password" value={form.confirm} onChange={e=>setForm(f=>({...f,confirm:e.target.value}))}/>
              {errs.confirm && <div className="err-text">{errs.confirm}</div>}
            </div>
          )}
          {isSignup && (
            <div className="field">
              <label>Phone (optional)</label>
              <input value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/>
            </div>
          )}
          {isSignup ? (
            <label className="check-row"><input type="checkbox" checked={form.terms} onChange={e=>setForm(f=>({...f,terms:e.target.checked}))}/> I agree to the Terms of Service and Privacy Policy</label>
          ) : (
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:20}}>
              <label className="check-row" style={{marginBottom:0}}><input type="checkbox" checked={form.remember} onChange={e=>setForm(f=>({...f,remember:e.target.checked}))}/> Remember me</label>
              <button type="button" className="link-btn" onClick={()=>ctx.pushToast('Password reset link sent')}>Forgot password?</button>
            </div>
          )}
          {errs.terms && <div className="err-text" style={{marginTop:-12, marginBottom:14}}>{errs.terms}</div>}
          <button className="btn btn-block" type="submit">{isSignup?'Create Account':'Log In'}</button>
        </form>
        <div className="auth-switch">
          {isSignup ? 'Already have an account?' : "Don't have an account?"}{' '}
          <button className="link-btn" onClick={()=>setAuthMode(isSignup?'login':'signup')}>{isSignup?'Log in':'Create one'}</button>
        </div>
      </div>
    </div>
  );
}

function Checkout({ctx}){
  const {cartActiveLines, goTo, addresses, setAddresses, paymentMethods, setPaymentMethods, user, placeOrder} = ctx;
  const [step, setStep] = useState(1);
  const [contact, setContact] = useState({email:user?.email||'', phone:''});
  const [selectedAddr, setSelectedAddr] = useState(addresses.find(a=>a.default)?.id || null);
  const [newAddr, setNewAddr] = useState({label:'Home', name:'', line1:'', city:'', notes:''});
  const [showNewAddr, setShowNewAddr] = useState(addresses.length===0);
  const [delivery, setDelivery] = useState('standard');
  const [selectedPm, setSelectedPm] = useState(paymentMethods[0]?.id || null);
  const [newPm, setNewPm] = useState({card:'', name:'', exp:''});
  const [showNewPm, setShowNewPm] = useState(paymentMethods.length===0);

  const items = cartActiveLines.map(l=>({...l, p:PRODUCTS.find(x=>x.id===l.productId)})).filter(l=>l.p);
  const subtotal = items.reduce((s,l)=>s+finalPrice(l.p)*l.qty,0);
  const shippingCost = delivery==='express' ? 150 : (subtotal>1500?0:90);
  const total = subtotal+shippingCost;

  if(items.length===0){
    return (
      <div className="wrap" style={{padding:'80px 0', textAlign:'center'}}>
        <h2 className="serif">Your cart is empty</h2>
        <p style={{color:'var(--ink-soft)', margin:'12px 0 24px'}}>Add something to your bag before checking out.</p>
        <button className="btn" onClick={()=>goTo('shop',{})}>Shop Now</button>
      </div>
    );
  }

  function addAddress(){
    if(!newAddr.name || !newAddr.line1 || !newAddr.city) return ctx.pushToast('Please complete the address fields');
    const addr = {id:'addr'+Date.now(), ...newAddr, default:addresses.length===0};
    setAddresses(a=>[...a, addr]);
    setSelectedAddr(addr.id);
    setShowNewAddr(false);
  }
  function addPayment(){
    if(!newPm.card || newPm.card.replace(/\s/g,'').length<12 || !newPm.name || !newPm.exp) return ctx.pushToast('Please complete the payment fields');
    const last4 = newPm.card.replace(/\s/g,'').slice(-4);
    const pm = {id:'pm'+Date.now(), brand: newPm.card.startsWith('4')?'Visa':'Mastercard', last4, exp:newPm.exp, name:newPm.name};
    setPaymentMethods(p=>[...p, pm]);
    setSelectedPm(pm.id);
    setShowNewPm(false);
    setNewPm({card:'',name:'',exp:''});
  }

  function reviewAndPlace(){
    const addr = addresses.find(a=>a.id===selectedAddr);
    const pm = paymentMethods.find(x=>x.id===selectedPm);
    const order = placeOrder({address:addr, payment:pm, deliveryMethod:delivery, shippingCost});
    goTo('confirmation',{orderId:order.id});
  }

  const steps = ['Contact','Shipping','Delivery','Payment','Review'];

  return (
    <div className="wrap checkout-grid">
      <div>
        <div className="steps-row">
          {steps.map((s,i)=>(
            <div key={s} className={'step-pill'+(step===i+1?' active':'')+(step>i+1?' done':'')}>
              <span className="num">{step>i+1?<Icon.check width="12" height="12"/>:i+1}</span>{s}
            </div>
          ))}
        </div>

        {step===1 && (
          <div className="co-card">
            <h3>Contact information</h3>
            <div className="field"><label>Email</label><input type="email" value={contact.email} onChange={e=>setContact(c=>({...c,email:e.target.value}))}/></div>
            <div className="field"><label>Phone</label><input value={contact.phone} onChange={e=>setContact(c=>({...c,phone:e.target.value}))} placeholder="+20 1xx xxx xxxx"/></div>
            <button className="btn" onClick={()=>{ if(!contact.email){ctx.pushToast('Enter an email to continue'); return;} setStep(2);}}>Continue to Shipping</button>
          </div>
        )}

        {step===2 && (
          <div className="co-card">
            <h3>Shipping address</h3>
            {addresses.map(a=>(
              <div key={a.id} className={'addr-option'+(selectedAddr===a.id?' sel':'')} onClick={()=>{setSelectedAddr(a.id); setShowNewAddr(false);}}>
                <input type="radio" checked={selectedAddr===a.id} readOnly/>
                <div><b>{a.label}</b> — {a.name}<br/><span style={{color:'var(--ink-soft)', fontSize:12.5}}>{a.line1}, {a.city}</span></div>
              </div>
            ))}
            {!showNewAddr && <button className="link-btn" onClick={()=>setShowNewAddr(true)}>+ Add a new address</button>}
            {showNewAddr && (
              <div style={{marginTop:14, paddingTop:14, borderTop:'1px solid var(--sand-line)'}}>
                <div className="field-grid2">
                  <div className="field"><label>Label</label><input value={newAddr.label} onChange={e=>setNewAddr(a=>({...a,label:e.target.value}))} placeholder="Home / Work"/></div>
                  <div className="field"><label>Full name</label><input value={newAddr.name} onChange={e=>setNewAddr(a=>({...a,name:e.target.value}))}/></div>
                </div>
                <div className="field"><label>Address</label><input value={newAddr.line1} onChange={e=>setNewAddr(a=>({...a,line1:e.target.value}))} placeholder="Street, building, apartment"/></div>
                <div className="field"><label>City</label><input value={newAddr.city} onChange={e=>setNewAddr(a=>({...a,city:e.target.value}))}/></div>
                <button className="btn btn-outline btn-sm" type="button" onClick={addAddress}>Save Address</button>
              </div>
            )}
            <div style={{marginTop:20, display:'flex', gap:10}}>
              <button className="btn btn-ghost" onClick={()=>setStep(1)}>Back</button>
              <button className="btn" onClick={()=>{ if(!selectedAddr){ctx.pushToast('Select or add an address'); return;} setStep(3);}}>Continue to Delivery</button>
            </div>
          </div>
        )}

        {step===3 && (
          <div className="co-card">
            <h3>Delivery method</h3>
            <div className={'ship-option'+(delivery==='standard'?' sel':'')} onClick={()=>setDelivery('standard')}>
              <div><input type="radio" checked={delivery==='standard'} readOnly/> <b style={{marginLeft:6}}>Standard</b> — 3–6 business days</div>
              <span className="mono">{subtotal>1500?'Free':fmt(90)}</span>
            </div>
            <div className={'ship-option'+(delivery==='express'?' sel':'')} onClick={()=>setDelivery('express')}>
              <div><input type="radio" checked={delivery==='express'} readOnly/> <b style={{marginLeft:6}}>Express</b> — 1–2 business days</div>
              <span className="mono">{fmt(150)}</span>
            </div>
            <div style={{marginTop:20, display:'flex', gap:10}}>
              <button className="btn btn-ghost" onClick={()=>setStep(2)}>Back</button>
              <button className="btn" onClick={()=>setStep(4)}>Continue to Payment</button>
            </div>
          </div>
        )}

        {step===4 && (
          <div className="co-card">
            <h3>Payment</h3>
            {paymentMethods.map(pm=>(
              <div key={pm.id} className={'pm-option'+(selectedPm===pm.id?' sel':'')} onClick={()=>{setSelectedPm(pm.id); setShowNewPm(false);}}>
                <input type="radio" checked={selectedPm===pm.id} readOnly/>
                <div>{pm.brand} •••• {pm.last4} <span style={{color:'var(--ink-soft)', fontSize:12}}>· exp {pm.exp}</span></div>
              </div>
            ))}
            {!showNewPm && <button className="link-btn" onClick={()=>setShowNewPm(true)}>+ Add a payment method</button>}
            {showNewPm && (
              <div style={{marginTop:14, paddingTop:14, borderTop:'1px solid var(--sand-line)'}}>
                <div className="field"><label>Card number</label><input value={newPm.card} onChange={e=>setNewPm(p=>({...p,card:e.target.value}))} placeholder="4242 4242 4242 4242" maxLength="19"/></div>
                <div className="field-grid2">
                  <div className="field"><label>Name on card</label><input value={newPm.name} onChange={e=>setNewPm(p=>({...p,name:e.target.value}))}/></div>
                  <div className="field"><label>Expiry (MM/YY)</label><input value={newPm.exp} onChange={e=>setNewPm(p=>({...p,exp:e.target.value}))} placeholder="08/28"/></div>
                </div>
                <p style={{fontSize:11.5, color:'var(--ink-soft)', marginBottom:12}}>Card details are encrypted at checkout and never stored in full — only the last 4 digits are kept on file.</p>
                <button className="btn btn-outline btn-sm" type="button" onClick={addPayment}>Save Payment Method</button>
              </div>
            )}
            <div style={{marginTop:20, display:'flex', gap:10}}>
              <button className="btn btn-ghost" onClick={()=>setStep(3)}>Back</button>
              <button className="btn" onClick={()=>{ if(!selectedPm){ctx.pushToast('Select or add a payment method'); return;} setStep(5);}}>Review Order</button>
            </div>
          </div>
        )}

        {step===5 && (
          <div className="co-card">
            <h3>Review your order</h3>
            {items.map((l,i)=>(
              <div className="mini-line" key={i}>
                <div className="cimg"><GarmentArt category={l.p.category} image={l.p.image}/></div>
                <div><div className="mn">{l.p.name}</div><div className="mm">{l.color} · {l.size} · Qty {l.qty}</div></div>
                <div className="mp">{fmt(finalPrice(l.p)*l.qty)}</div>
              </div>
            ))}
            <div style={{marginTop:16, fontSize:13}}>
              <p><b>Ship to:</b> {addresses.find(a=>a.id===selectedAddr)?.name}, {addresses.find(a=>a.id===selectedAddr)?.line1}, {addresses.find(a=>a.id===selectedAddr)?.city}</p>
              <p style={{marginTop:6}}><b>Payment:</b> {paymentMethods.find(x=>x.id===selectedPm)?.brand} •••• {paymentMethods.find(x=>x.id===selectedPm)?.last4}</p>
              <p style={{marginTop:6}}><b>Delivery:</b> {delivery==='express'?'Express (1–2 days)':'Standard (3–6 days)'}</p>
            </div>
            <div style={{marginTop:20, display:'flex', gap:10}}>
              <button className="btn btn-ghost" onClick={()=>setStep(4)}>Back</button>
              <button className="btn" onClick={reviewAndPlace}>Place Order</button>
            </div>
          </div>
        )}
      </div>

      <div className="order-summary">
        <h3 className="serif" style={{fontSize:18, marginBottom:16}}>Order summary</h3>
        {items.map((l,i)=>(
          <div className="mini-line" key={i}>
            <div className="cimg"><GarmentArt category={l.p.category} image={l.p.image}/></div>
            <div><div className="mn">{l.p.name}</div><div className="mm">{l.color} · {l.size} · ×{l.qty}</div></div>
            <div className="mp">{fmt(finalPrice(l.p)*l.qty)}</div>
          </div>
        ))}
        <div className="sum-row" style={{marginTop:10}}><span>Subtotal</span><span className="mono">{fmt(subtotal)}</span></div>
        <div className="sum-row"><span>Shipping</span><span className="mono">{shippingCost===0?'Free':fmt(shippingCost)}</span></div>
        <div className="sum-row total"><span>Total</span><span className="mono">{fmt(total)}</span></div>
      </div>
    </div>
  );
}

function Confirmation({ctx}){
  const {orders, goTo} = ctx;
  const order = orders[0];
  if(!order) return <div className="wrap section">No recent order found.</div>;
  return (
    <div className="wrap confirm-wrap">
      <div className="confirm-icon"><Icon.check width="30" height="30"/></div>
      <h1>Order confirmed</h1>
      <p style={{color:'var(--ink-soft)', fontSize:14.5}}>Thank you for your purchase — a confirmation has been sent to your email.</p>
      <div className="order-num mono">Order #{order.id}</div>
      <div style={{display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap'}}>
        <button className="btn" onClick={()=>goTo('dashboard-order-detail',{id:order.id})}>View Order</button>
        <button className="btn btn-outline" onClick={()=>goTo('shop',{})}>Continue Shopping</button>
      </div>
    </div>
  );
}

function Dashboard({ctx, tab}){
  const {user, goTo, requireAuth, orders, wishlist, addresses, setAddresses, paymentMethods, setPaymentMethods, handleLogout, route} = ctx;
  useEffect(()=>{ if(!user) requireAuth('dashboard',{}); },[user]);
  if(!user){
    return <div className="wrap" style={{padding:'100px 0', textAlign:'center'}}>
      <h2 className="serif">Please log in</h2>
      <p style={{color:'var(--ink-soft)', margin:'10px 0 20px'}}>You need an account to view your dashboard.</p>
    </div>;
  }
  const navList = [
    ['Dashboard','dashboard','home'],
    ['Orders','dashboard-orders','orders'],
    ['Saved Items','dashboard-saved','saved'],

function DashOrderDetail({ctx}){
  const {route, orders, goTo} = ctx;
  const o = orders.find(x=>x.id===route.params.id) || orders[0];
  if(!o) return <div className="empty-state"><h3>Order not found</h3></div>;
  const STAGES = ['Processing','Confirmed','Shipped','Out for Delivery','Delivered'];
  const stageIdx = Math.max(0, STAGES.indexOf(o.status));
  return (
    <div>
      <button className="link-btn" style={{marginBottom:14}} onClick={()=>goTo('dashboard-orders',{})}>← Back to Orders</button>
      <div className="section-head"><h2 style={{fontSize:24}}>Order #{o.id}</h2><span className={'status-pill status-'+o.status.replace(/\s/g,'')}>{o.status}</span></div>
      <p style={{fontSize:13, color:'var(--ink-soft)', marginBottom:24}}>Placed on {new Date(o.date).toLocaleDateString()}</p>
      {o.status!=='Cancelled' && (
        <div className="co-card">
          <h3 style={{fontSize:15, display:'flex', alignItems:'center', gap:8}}><Icon.truck width="16" height="16"/> Tracking</h3>
          <div style={{display:'flex', justifyContent:'space-between', marginTop:14}}>
            {STAGES.map((s,i)=>(
              <div key={s} style={{textAlign:'center', flex:1, position:'relative'}}>
                <div style={{width:12,height:12,borderRadius:'50%', margin:'0 auto 6px', background: i<=stageIdx?'var(--teal)':'var(--sand-line)'}}/>
                <div style={{fontSize:10.5, color: i<=stageIdx?'var(--ink)':'var(--ink-soft)'}}>{s}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      <div className="co-card">
        <h3 style={{fontSize:15}}>Items</h3>
        {o.items.map((it,i)=>{ const p=PRODUCTS.find(x=>x.id===it.productId);
          return <div className="mini-line" key={i}>
            <div className="cimg">{p && <GarmentArt category={p.category} image={p.image}/>}</div>
            <div><div className="mn">{it.name}</div><div className="mm">{it.brand} · {it.color} · {it.size} · ×{it.qty}</div></div>
            <div className="mp">{fmt(it.price*it.qty)}</div>
          </div>;
        })}
        <div className="sum-row" style={{marginTop:10}}><span>Subtotal</span><span className="mono">{fmt(o.subtotal)}</span></div>
        <div className="sum-row"><span>Shipping</span><span className="mono">{o.shipping===0?'Free':fmt(o.shipping)}</span></div>
        <div className="sum-row total"><span>Total</span><span className="mono">{fmt(o.total)}</span></div>
      </div>
      <div className="co-card">
        <h3 style={{fontSize:15}}>Shipping address</h3>
        <p style={{fontSize:13, color:'var(--ink-soft)'}}>{o.address?.name}<br/>{o.address?.line1}, {o.address?.city}</p>
      </div>
      <div className="co-card">
        <h3 style={{fontSize:15}}>Payment method</h3>
        <p style={{fontSize:13, color:'var(--ink-soft)'}}>{o.payment?.brand} •••• {o.payment?.last4}</p>
      </div>
    </div>
  );
}

function DashAddresses({ctx}){

  const [editing, setEditing] = useState(null);

    if(!form.name||!form.line1||!form.city) return ctx.pushToast('Complete all fields');
    if(editing){
      setAddresses(a=>a.map(x=>x.id===editing?{...x,...form}:x));
      setEditing(null);
    } else {
      setAddresses(a=>[...a, {id:'addr'+Date.now(), ...form, default:a.length===0}]);
    }
    setForm({label:'Home',name:'',line1:'',city:''});
  }
  return (
    <div>
      <div className="section-head"><h2 style={{fontSize:24}}>Saved Addresses</h2></div>
      {addresses.map(a=>(
        <div key={a.id} className="co-card" style={{padding:18}}>
          <div style={{display:'flex', justifyContent:'space-between'}}>
            <div>
              <div className="eyebrow" style={{marginBottom:4}}>{a.label} {a.default && '· Default'}</div>
              <div style={{fontWeight:600, fontSize:14}}>{a.name}</div>
              <div style={{fontSize:13, color:'var(--ink-soft)'}}>{a.line1}, {a.city}</div>
            </div>
            <div style={{display:'flex', gap:8, alignItems:'flex-start'}}>
              {!a.default && <button className="link-btn" onClick={()=>setAddresses(list=>list.map(x=>({...x, default:x.id===a.id})))}>Set default</button>}
              <button className="link-btn" onClick={()=>{setEditing(a.id); setForm({label:a.label,name:a.name,line1:a.line1,city:a.city});}}>Edit</button>
              <button className="link-btn" style={{color:'var(--err)'}} onClick={()=>setAddresses(list=>list.filter(x=>x.id!==a.id))}>Delete</button>
            </div>
          </div>
        </div>
      ))}
      <div className="co-card">
        <h3 style={{fontSize:15}}>{editing?'Edit address':'Add a new address'}</h3>
        <div className="field-grid2">
          <div className="field"><label>Label</label><input value={form.label} onChange={e=>setForm(f=>({...f,label:e.target.value}))}/></div>
          <div className="field"><label>Full name</label><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
        </div>
        <div className="field"><label>Address</label><input value={form.line1} onChange={e=>setForm(f=>({...f,line1:e.target.value}))}/></div>
        <div className="field"><label>City</label><input value={form.city} onChange={e=>setForm(f=>({...f,city:e.target.value}))}/></div>
        <button className="btn btn-sm" onClick={add}>{editing?'Save Changes':'+ Add Address'}</button>

  );

function DashPayments({ctx}){

  function add(){
    if(!form.card || form.card.replace(/\s/g,'').length<12 || !form.name || !form.exp) return ctx.pushToast('Complete all fields');
    const last4 = form.card.replace(/\s/g,'').slice(-4);
    setPaymentMethods(p=>[...p, {id:'pm'+Date.now(), brand: form.card.startsWith('4')?'Visa':'Mastercard', last4, exp:form.exp, name:form.name}]);
    setForm({card:'',name:'',exp:''});
    ctx.pushToast('Payment method added');
  }
  return (
    <div>
      <div className="section-head"><h2 style={{fontSize:24}}>Payment Methods</h2></div>
      {paymentMethods.map(pm=>(
        <div key={pm.id} className="pm-card">
          <div>{pm.brand} •••• {pm.last4} <span style={{color:'var(--ink-soft)', fontSize:12}}>· Expires {pm.exp}</span></div>
          <button className="link-btn" style={{color:'var(--err)'}} onClick={()=>setPaymentMethods(list=>list.filter(x=>x.id!==pm.id))}>Remove</button>

        <h3 style={{fontSize:15}}>Add a payment method</h3>
        <div className="field"><label>Card number</label><input value={form.card} onChange={e=>setForm(f=>({...f,card:e.target.value}))} placeholder="4242 4242 4242 4242"/></div>
        <div className="field-grid2">
          <div className="field"><label>Name on card</label><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
          <div className="field"><label>Expiry</label><input value={form.exp} onChange={e=>setForm(f=>({...f,exp:e.target.value}))} placeholder="08/28"/></div>

function AdminProductForm({ctx, product, onClose}){
  const isEdit = !!product;
  const [f, setF] = useState(()=> product ? {...product} : {
    brandId: BRAND_DEFS[0].id, gender:'unisex', category:CATEGORIES.unisex[0], name:'',
    price:500, discount:0, colorSet:'neutral', sizeSet:'top', stock:10, tags:[], image:null,
  });
  const genderCats = CATEGORIES[f.gender] || CATEGORIES.unisex;

  function set(k,v){ setF(s=>({...s,[k]:v})); }
  function toggleTag(t){ setF(s=>({...s, tags: s.tags.includes(t) ? s.tags.filter(x=>x!==t) : [...s.tags, t]})); }
  function onImageFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=> set('image', reader.result);
    reader.readAsDataURL(file);
  }

  function submit(e){
    e.preventDefault();
    if(!f.name.trim()){ ctx.pushToast('Product needs a name'); return; }
    const brand = BRAND_DEFS.find(b=>b.id===f.brandId);
    const sizeMap = {top:SIZES_TOP, bottom:SIZES_BOTTOM, one:SIZES_ONE};
    const fields = {
      brand: brand.name, brandId: f.brandId, gender: f.gender, category: f.category, name: f.name.trim(),
      price: Number(f.price)||0, discount: Number(f.discount)||0, colors: COLOR_SETS[f.colorSet],
      sizes: sizeMap[f.sizeSet], stock: Number(f.stock)||0, tags: f.tags, desc: f.desc || desc(f.category),
      image: f.image,
    };
    if(isEdit){ ctx.adminUpdateProduct(product.id, fields); }
    else{ ctx.adminAddProduct(fields); }
    onClose();
  }

  return (
    <div className="auth-scrim" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="auth-card" style={{width:560}}>
        <button className="auth-close icon-btn" onClick={onClose}><Icon.close width="18" height="18"/></button>
        <h2>{isEdit?'Edit product':'Add product'}</h2>
        <p className="sub">{isEdit?product.name:'New catalog item'}</p>
        <form onSubmit={submit}>
          <div className="field">
            <label>Photo</label>
            <div style={{display:'flex', gap:14, alignItems:'center'}}>
              <div style={{width:70, height:88, borderRadius:2, overflow:'hidden', background:'var(--sand)', flexShrink:0}}>
                <GarmentArt category={f.category} image={f.image}/>
              </div>
              <div>
                <input type="file" accept="image/*" onChange={e=>onImageFile(e.target.files[0])}/>
                {f.image && <button type="button" className="link-btn" style={{marginTop:6, display:'block'}} onClick={()=>set('image',null)}>Remove photo</button>}
              </div>
            </div>
          </div>
          <div className="field"><label>Name</label><input value={f.name} onChange={e=>set('name',e.target.value)}/></div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
            <div className="field">
              <label>Brand</label>
              <select value={f.brandId} onChange={e=>set('brandId',e.target.value)}>
                {BRAND_DEFS.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Gender</label>
              <select value={f.gender} onChange={e=>{ const g=e.target.value; setF(s=>({...s, gender:g, category:CATEGORIES[g][0]})); }}>
                <option value="men">Men</option><option value="women">Women</option><option value="unisex">Unisex</option>
              </select>
            </div>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
            <div className="field">
              <label>Category</label>
              <select value={f.category} onChange={e=>set('category',e.target.value)}>
                {genderCats.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Color set</label>
              <select value={f.colorSet} onChange={e=>set('colorSet',e.target.value)}>
                {Object.keys(COLOR_SETS).map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14}}>
            <div className="field"><label>Price (EGP)</label><input type="number" min="0" value={f.price} onChange={e=>set('price',e.target.value)}/></div>
            <div className="field"><label>Discount %</label><input type="number" min="0" max="90" value={f.discount} onChange={e=>set('discount',e.target.value)}/></div>
            <div className="field"><label>Stock</label><input type="number" min="0" value={f.stock} onChange={e=>set('stock',e.target.value)}/></div>
          </div>
          <div className="field">
            <label>Size range</label>
            <select value={f.sizeSet} onChange={e=>set('sizeSet',e.target.value)}>
              <option value="top">Top (XS–XL)</option>
              <option value="bottom">Bottom (28–36)</option>
              <option value="one">One size</option>
            </select>
          </div>
          <div className="field">
            <label>Tags</label>
            <div style={{display:'flex', gap:16}}>
              {['new','trending','sale'].map(t=>(
                <label key={t} className="check-row" style={{marginBottom:0}}>
                  <input type="checkbox" checked={f.tags.includes(t)} onChange={()=>toggleTag(t)}/> {t}
                </label>
              ))}
            </div>
          </div>
          <div style={{display:'flex', gap:10, marginTop:10}}>
            <button className="btn btn-block" type="submit">{isEdit?'Save changes':'Add product'}</button>
            <button className="btn btn-outline btn-block" type="button" onClick={onClose}>Cancel</button>
          </div>
        </form>
      </div>
    </div>
  );
}
