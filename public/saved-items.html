<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Items — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="saved-items">
<div id="site-header-slot"></div>

<div class="container dash-layout">
  <div id="dash-nav-slot"></div>
  <div>
    <h1 class="dash-welcome">Saved Items</h1>
    <p class="dash-sub">Products you've favorited.</p>
    <div class="product-grid" id="saved-grid"><div class="spinner"></div></div>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
async function load() {
  if (!requireAuthOrRedirect()) return;
  document.getElementById('dash-nav-slot').innerHTML = dashNavHTML('saved');
  initDashLogout();
  const { items } = await API.get('/api/wishlist');
  const grid = document.getElementById('saved-grid');
  grid.innerHTML = items.length ? items.map(p => `<div>${productCardHTML(p)}</div>`).join('') : `
    <div class="empty-state" style="grid-column:1/-1">
      <h3>No saved items yet</h3>
      <p>Tap the heart icon on any product to save it here.</p>
      <a href="/shop.html" class="btn btn-primary" style="margin-top:16px">Browse Products</a>
    </div>`;
  grid.querySelectorAll('.js-fav-btn').forEach(b => b.classList.add('active'));
}
document.addEventListener('chrome:ready', load);
</script>
</body>
</html>
