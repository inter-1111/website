<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="dashboard">
<div id="site-header-slot"></div>

<div class="container dash-layout">
  <div id="dash-nav-slot"></div>
  <div>
    <h1 class="dash-welcome" id="welcome-msg">Welcome back</h1>
    <p class="dash-sub">Here's what's happening with your account.</p>

    <div class="dash-cards">
      <a href="/orders.html" class="dash-quick-card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>View Orders</span>
      </a>
      <a href="/saved-items.html" class="dash-quick-card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>
        <span>Saved Items</span>
      </a>
      <a href="/addresses.html" class="dash-quick-card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Manage Addresses</span>
      </a>
      <a href="/account-settings.html" class="dash-quick-card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Account Settings</span>
      </a>
    </div>

    <div class="dash-section" style="margin-bottom:44px">
      <h3>Recent Orders</h3>
      <div id="recent-orders"><div class="spinner"></div></div>
    </div>

    <div class="dash-section">
      <h3>Saved Items</h3>
      <div class="product-grid" id="recent-saved"></div>
    </div>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
async function load() {
  if (!requireAuthOrRedirect()) return;
  document.getElementById('dash-nav-slot').innerHTML = dashNavHTML('dashboard');
  initDashLogout();
  document.getElementById('welcome-msg').textContent = `Welcome back, ${SITE.user.name.split(' ')[0]}`;

  const { orders } = await API.get('/api/orders');
  const recent = orders.slice(0, 3);
  document.getElementById('recent-orders').innerHTML = recent.length ? recent.map(o => `
    <div class="order-row">
      <div><div class="num">${o.order_number}</div><div class="meta">${new Date(o.created_at).toLocaleDateString()} · ${o.item_count} item${o.item_count === 1 ? '' : 's'} · ${formatPrice(o.total)}</div></div>
      <div class="flex items-center" style="gap:14px"><span class="status-pill">${o.status}</span><a href="/order-detail.html?id=${o.id}" class="btn btn-ghost btn-sm">View</a></div>
    </div>`).join('') : `<p class="text-soft">You haven't placed any orders yet.</p>`;

  const { items } = await API.get('/api/wishlist');
  document.getElementById('recent-saved').innerHTML = items.length ? items.slice(0, 4).map(productCardHTML).join('') : `<p class="text-soft">No saved items yet.</p>`;
}
document.addEventListener('chrome:ready', load);
</script>
</body>
</html>
