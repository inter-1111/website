<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
<div id="site-header-slot"></div>

<div class="container">
  <div class="form-card">
    <h1>Welcome Back</h1>
    <p class="form-sub">Log in to continue to your account.</p>
    <div class="form-error" id="form-error"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" required></div>
      <div class="flex justify-between items-center" style="margin-bottom:22px">
        <label class="checkbox-row"><input type="checkbox" id="remember" checked> Remember me</label>
        <a href="#" style="font-size:13px;text-decoration:underline" id="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
    </form>
    <div class="divider-or">or</div>
    <p style="text-align:center;font-size:14px">Don't have an account? <a href="/signup.html" id="signup-link" style="text-decoration:underline;font-weight:600">Create one</a></p>
    <p style="text-align:center;font-size:12px;color:var(--color-ink-soft);margin-top:20px">Demo admin: admin@marketplace.local / Admin123!</p>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
const next = new URLSearchParams(location.search).get('next') || '/dashboard.html';
document.getElementById('signup-link').href = '/signup.html?next=' + encodeURIComponent(next);
document.getElementById('forgot-link').addEventListener('click', (e) => { e.preventDefault(); Toast.show('Password reset isn\'t available in this demo.'); });

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('form-error');
  errBox.classList.remove('show');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    await API.post('/api/auth/login', { email: document.getElementById('email').value, password: document.getElementById('password').value });
    location.href = next;
  } catch (err) {
    errBox.textContent = err.message; errBox.classList.add('show');
    btn.disabled = false; btn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
