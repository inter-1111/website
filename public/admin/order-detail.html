<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Detail — M3RAFSH Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-sidebar-slot"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="order-heading">Order</h1>
      <a href="/admin/orders.html" class="admin-view-site">← Back to Orders</a>
    </div>
    <div class="admin-form-grid" id="order-root"><div class="spinner"></div></div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/admin.js"></script>
<script>
function formatPrice(n) { return '$' + Number(n).toFixed(2).replace(/\.00$/, ''); }
const STATUSES = ['Processing', 'Confirmed', 'Shipped', 'Out for Delivery', 'Delivered', 'Cancelled'];
const id = new URLSearchParams(location.search).get('id');

async function load() {
  const user = await adminGuard('orders');
  if (!user) return;
  const { order, items } = await API.get('/api/admin/orders/' + id);
  document.getElementById('order-heading').textContent = order.order_number;

  document.getElementById('order-root').innerHTML = `
    <div>
      <div class="admin-card">
        <h3 style="font-size:15px;margin-bottom:16px">Items</h3>
        ${items.map(it => `
          <div class="mini-order-item">
            <img src="${it.image_url || Placeholder.productImage('o'+it.id, it.product_name)}">
            <div style="flex:1"><div style="font-weight:600">${escapeHTML(it.product_name)}</div><div class="text-soft">${escapeHTML(it.brand_name)} · ${[it.size, it.color].filter(Boolean).join(' / ') || 'One size'} · Qty ${it.qty}</div></div>
            <div>${formatPrice(it.price * it.qty)}</div>
          </div>`).join('')}
        <div class="summary-row"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${order.shipping === 0 ? 'Free' : formatPrice(order.shipping)}</span></div>
        <div class="summary-row total"><span>Total</span><span>${formatPrice(order.total)}</span></div>
      </div>
      <div class="admin-card">
        <h3 style="font-size:15px;margin-bottom:16px">Shipping Address</h3>
        <p style="font-size:14px">${order.address.full_name || ''}<br>${order.address.line1 || ''}, ${order.address.city || ''}${order.address.state ? ', ' + order.address.state : ''} ${order.address.zip || ''}<br>${order.address.country || ''}</p>
      </div>
      <div class="admin-card">
        <h3 style="font-size:15px;margin-bottom:16px">Payment</h3>
        <p style="font-size:14px">${order.payment_snapshot}</p>
      </div>
    </div>
    <div>
      <div class="admin-card">
        <h3 style="font-size:15px;margin-bottom:16px">Customer</h3>
        <p style="font-size:14px">${escapeHTML(order.user_name)}<br>${escapeHTML(order.user_email)}</p>
      </div>
      <div class="admin-card">
        <h3 style="font-size:15px;margin-bottom:16px">Order Status</h3>
        <div class="field"><select id="status-select">${STATUSES.map(s => `<option ${s === order.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <button class="btn btn-primary btn-block" id="update-status-btn">Update Status</button>
      </div>
    </div>`;

  document.getElementById('update-status-btn').addEventListener('click', async () => {
    const status = document.getElementById('status-select').value;
    await API.put(`/api/admin/orders/${id}/status`, { status });
    Toast.show('Order status updated.');
  });
}
load();
</script>
</body>
</html>
