<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="cart">
<div id="site-header-slot"></div>

<div class="container">
  <div class="page-title-block"><h1>Your Cart</h1></div>
  <div class="cart-layout" id="cart-layout">
    <div class="spinner"></div>
  </div>
</div>

<div class="modal-backdrop" id="auth-gate-modal">
  <div class="modal-box">
    <button class="modal-close-x" id="auth-gate-close">✕</button>
    <div class="auth-gate-card">
      <h3>Your Cart Is Ready</h3>
      <p>To continue to checkout, please log in or create an account. Your cart will be right here when you get back.</p>
      <div class="auth-gate-actions">
        <a href="/login.html?next=/checkout.html" class="btn btn-primary btn-block">Log In</a>
        <a href="/signup.html?next=/checkout.html" class="btn btn-secondary btn-block">Create Account</a>
        <button class="btn btn-ghost btn-block" id="auth-gate-continue">Continue Shopping</button>
      </div>
    </div>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
let cart;

function lineHTML(it) {
  const img = it.image || Placeholder.productImage('p' + it.product_id, it.name);
  return `
  <div class="cart-line" data-item-id="${it.cart_item_id}">
    <div class="cart-line-img"><img src="${img}" alt="${it.name}"></div>
    <div class="cart-line-meta">
      <div class="brand">${it.brand_name}</div>
      <div class="name"><a href="/product.html?id=${it.slug}">${it.name}</a></div>
      <div class="variant">${[it.size, it.color].filter(Boolean).join(' · ') || 'One size'}</div>
      <div class="qty-selector">
        <button class="js-qty-minus">−</button><span>${it.qty}</span><button class="js-qty-plus">+</button>
      </div>
      <div class="cart-line-actions" style="margin-top:10px">
        <button class="js-remove">Remove</button>
        <button class="js-save-later">Save for later</button>
      </div>
    </div>
    <div class="cart-line-right">
      <div style="font-weight:700">${formatPrice(it.line_total)}</div>
      <div class="text-soft" style="font-size:12px">${formatPrice(it.unit_price)} each</div>
    </div>
  </div>`;
}

function savedLineHTML(it) {
  const img = it.image || Placeholder.productImage('p' + it.product_id, it.name);
  return `
  <div class="cart-line" data-item-id="${it.cart_item_id}">
    <div class="cart-line-img"><img src="${img}" alt="${it.name}"></div>
    <div class="cart-line-meta">
      <div class="brand">${it.brand_name}</div>
      <div class="name"><a href="/product.html?id=${it.slug}">${it.name}</a></div>
      <div class="variant">${[it.size, it.color].filter(Boolean).join(' · ') || 'One size'}</div>
      <div class="cart-line-actions" style="margin-top:10px">
        <button class="js-move-to-cart">Move to cart</button>
        <button class="js-remove">Remove</button>
      </div>
    </div>
    <div class="cart-line-right"><div style="font-weight:700">${formatPrice(it.unit_price)}</div></div>
  </div>`;
}

function render() {
  const layout = document.getElementById('cart-layout');
  if (!cart.items.length && !cart.saved_items.length) {
    layout.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <h3>Your cart is empty</h3>
        <p>Looks like you haven't added anything yet.</p>
        <a href="/shop.html" class="btn btn-primary" style="margin-top:20px">Continue Shopping</a>
      </div>`;
    return;
  }
  layout.innerHTML = `
    <div>
      ${cart.items.map(lineHTML).join('')}
      ${cart.saved_items.length ? `<div style="margin-top:40px"><h3 style="font-size:18px;margin-bottom:16px">Saved For Later</h3>${cart.saved_items.map(savedLineHTML).join('')}</div>` : ''}
      <a href="/shop.html" class="btn btn-ghost" style="margin-top:24px">← Continue Shopping</a>
    </div>
    <div class="summary-card">
      <h3 style="font-size:18px;margin-bottom:16px">Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span>${formatPrice(cart.subtotal)}</span></div>
      <div class="summary-row"><span>Shipping</span><span>${cart.shipping === 0 ? 'Free' : formatPrice(cart.shipping)}</span></div>
      <div class="summary-row total"><span>Estimated Total</span><span>${formatPrice(cart.total)}</span></div>
      <button class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:18px" ${cart.items.length ? '' : 'disabled'}>Proceed to Checkout</button>
    </div>`;

  layout.querySelectorAll('.js-qty-minus').forEach(b => b.addEventListener('click', async (e) => {
    const id = e.target.closest('.cart-line').dataset.itemId;
    const item = cart.items.find(i => i.cart_item_id == id);
    if (item.qty <= 1) return;
    cart = await API.put('/api/cart/' + id, { qty: item.qty - 1 });
    SITE.cartCount = cart.count; renderCartBadge(); render();
  }));
  layout.querySelectorAll('.js-qty-plus').forEach(b => b.addEventListener('click', async (e) => {
    const id = e.target.closest('.cart-line').dataset.itemId;
    const item = cart.items.find(i => i.cart_item_id == id);
    cart = await API.put('/api/cart/' + id, { qty: item.qty + 1 });
    SITE.cartCount = cart.count; renderCartBadge(); render();
  }));
  layout.querySelectorAll('.js-remove').forEach(b => b.addEventListener('click', async (e) => {
    const id = e.target.closest('.cart-line').dataset.itemId;
    cart = await API.del('/api/cart/' + id);
    SITE.cartCount = cart.count; renderCartBadge(); render();
    Toast.show('Item removed.');
  }));
  layout.querySelectorAll('.js-save-later').forEach(b => b.addEventListener('click', async (e) => {
    const id = e.target.closest('.cart-line').dataset.itemId;
    cart = await API.put('/api/cart/' + id, { saved_for_later: true });
    SITE.cartCount = cart.count; renderCartBadge(); render();
  }));
  layout.querySelectorAll('.js-move-to-cart').forEach(b => b.addEventListener('click', async (e) => {
    const id = e.target.closest('.cart-line').dataset.itemId;
    cart = await API.put('/api/cart/' + id, { saved_for_later: false });
    SITE.cartCount = cart.count; renderCartBadge(); render();
  }));
  const checkoutBtn = document.getElementById('checkout-btn');
  if (checkoutBtn) checkoutBtn.addEventListener('click', () => {
    if (!SITE.user) document.getElementById('auth-gate-modal').classList.add('open');
    else location.href = '/checkout.html';
  });
}

document.getElementById('auth-gate-close').addEventListener('click', () => document.getElementById('auth-gate-modal').classList.remove('open'));
document.getElementById('auth-gate-continue').addEventListener('click', () => document.getElementById('auth-gate-modal').classList.remove('open'));

async function load() {
  cart = await API.get('/api/cart');
  render();
}
document.addEventListener('chrome:ready', load);
</script>
</body>
</html>
