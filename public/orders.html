<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Orders — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="orders">
<div id="site-header-slot"></div>

<div class="container dash-layout">
  <div id="dash-nav-slot"></div>
  <div>
    <h1 class="dash-welcome">Your Orders</h1>
    <p class="dash-sub">Track and review your order history.</p>
    <div id="orders-list"><div class="spinner"></div></div>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
async function load() {
  if (!requireAuthOrRedirect()) return;
  document.getElementById('dash-nav-slot').innerHTML = dashNavHTML('orders');
  initDashLogout();
  const { orders } = await API.get('/api/orders');
  document.getElementById('orders-list').innerHTML = orders.length ? orders.map(o => `
    <div class="order-row">
      <div><div class="num">${o.order_number}</div><div class="meta">${new Date(o.created_at).toLocaleDateString()} · ${o.item_count} item${o.item_count === 1 ? '' : 's'} · ${formatPrice(o.total)}</div></div>
      <div class="flex items-center" style="gap:14px"><span class="status-pill">${o.status}</span><a href="/order-detail.html?id=${o.id}" class="btn btn-ghost btn-sm">View Details</a></div>
    </div>`).join('') : `
    <div class="empty-state">
      <h3>No orders yet</h3>
      <p>When you place an order, it will show up here.</p>
      <a href="/shop.html" class="btn btn-primary" style="margin-top:16px">Start Shopping</a>
    </div>`;
}
document.addEventListener('chrome:ready', load);
</script>
</body>
</html>
