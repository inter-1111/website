<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="checkout">
<div id="site-header-slot"></div>

<div class="container">
  <div class="page-title-block"><h1>Checkout</h1></div>
  <div class="checkout-steps">
    <div class="checkout-step active" data-step="1">1. Contact</div>
    <div class="checkout-step" data-step="2">2. Shipping</div>
    <div class="checkout-step" data-step="3">3. Delivery</div>
    <div class="checkout-step" data-step="4">4. Payment</div>
    <div class="checkout-step" data-step="5">5. Review</div>
  </div>

  <div class="checkout-layout" id="checkout-content">
    <div class="spinner"></div>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
let cart, addresses = [], paymentMethods = [];
let selectedAddressId = null, newAddress = null;
let selectedPaymentId = null, newCard = null;
let deliveryMethod = 'standard';

function markStep(n) {
  document.querySelectorAll('.checkout-step').forEach(s => {
    const step = Number(s.dataset.step);
    s.classList.toggle('active', step === n);
    s.classList.toggle('done', step < n);
  });
}

function summarySidebar() {
  return `
    <div class="summary-card">
      <h3 style="font-size:18px;margin-bottom:16px">Order Summary</h3>
      ${cart.items.map(it => `
        <div class="mini-order-item">
          <img src="${it.image || Placeholder.productImage('p'+it.product_id, it.name)}">
          <div style="flex:1">
            <div style="font-weight:600">${it.name}</div>
            <div class="text-soft">${it.brand_name} · ${[it.size, it.color].filter(Boolean).join(' / ') || 'One size'} · Qty ${it.qty}</div>
          </div>
          <div>${formatPrice(it.line_total)}</div>
        </div>`).join('')}
      <div class="summary-row"><span>Subtotal</span><span>${formatPrice(cart.subtotal)}</span></div>
      <div class="summary-row"><span>Shipping</span><span>${cart.shipping === 0 ? 'Free' : formatPrice(cart.shipping)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${formatPrice(cart.total)}</span></div>
    </div>`;
}

function renderContact() {
  markStep(1);
  document.getElementById('checkout-content').innerHTML = `
    <div>
      <div class="checkout-section">
        <h3>Contact Information</h3>
        <div class="field"><label>Email</label><input type="email" id="contact-email" value="${SITE.user.email}" readonly></div>
        <div class="field"><label>Phone</label><input type="tel" id="contact-phone" value="${SITE.user.phone || ''}" placeholder="Phone number"></div>
        <button class="btn btn-primary" id="to-step-2">Continue to Shipping</button>
      </div>
    </div>
    ${summarySidebar()}`;
  document.getElementById('to-step-2').addEventListener('click', renderShipping);
}

function addressCardHTML(a) {
  return `
    <div class="saved-option ${selectedAddressId === a.id ? 'selected' : ''}" data-id="${a.id}">
      <div>
        <div style="font-weight:700">${a.label || 'Address'} ${a.is_default ? '<span class="default-badge">Default</span>' : ''}</div>
        <div class="text-soft" style="font-size:13px;margin-top:4px">${a.full_name}<br>${a.line1}, ${a.city}${a.state ? ', ' + a.state : ''} ${a.zip}<br>${a.country || ''}</div>
      </div>
      <input type="radio" name="addr" ${selectedAddressId === a.id ? 'checked' : ''}>
    </div>`;
}

function renderShipping() {
  markStep(2);
  document.getElementById('checkout-content').innerHTML = `
    <div>
      <div class="checkout-section">
        <h3>Shipping Address</h3>
        <div id="address-list">${addresses.map(addressCardHTML).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-address-btn" style="margin-top:6px">+ Add New Address</button>
        <div id="new-address-form" style="display:none;margin-top:18px;border-top:1px solid var(--color-line);padding-top:18px">
          <div class="field-row"><div class="field"><label>Full Name</label><input id="na-name" value="${SITE.user.name}"></div><div class="field"><label>Label</label><input id="na-label" placeholder="Home, Work..."></div></div>
          <div class="field"><label>Address Line</label><input id="na-line1"></div>
          <div class="field-row">
            <div class="field"><label>City</label><input id="na-city"></div>
            <div class="field"><label>State</label><input id="na-state"></div>
            <div class="field"><label>ZIP</label><input id="na-zip"></div>
          </div>
          <div class="field"><label>Country</label><input id="na-country"></div>
        </div>
        <div class="flex justify-between" style="margin-top:20px">
          <button class="btn btn-ghost" id="back-1">Back</button>
          <button class="btn btn-primary" id="to-step-3">Continue to Delivery</button>
        </div>
      </div>
    </div>
    ${summarySidebar()}`;

  document.querySelectorAll('.saved-option').forEach(el => el.addEventListener('click', () => {
    selectedAddressId = Number(el.dataset.id); newAddress = null;
    document.querySelectorAll('.saved-option').forEach(x => { x.classList.remove('selected'); x.querySelector('input').checked = false; });
    el.classList.add('selected'); el.querySelector('input').checked = true;
    document.getElementById('new-address-form').style.display = 'none';
  }));
  document.getElementById('add-address-btn').addEventListener('click', () => {
    selectedAddressId = null;
    document.querySelectorAll('.saved-option').forEach(x => x.classList.remove('selected'));
    document.getElementById('new-address-form').style.display = 'block';
  });
  document.getElementById('back-1').addEventListener('click', renderContact);
  document.getElementById('to-step-3').addEventListener('click', () => {
    if (!selectedAddressId) {
      const line1 = document.getElementById('na-line1').value, city = document.getElementById('na-city').value;
      if (!line1 || !city) { Toast.show('Please fill in an address or select a saved one.'); return; }
      newAddress = {
        label: document.getElementById('na-label').value || 'Home',
        full_name: document.getElementById('na-name').value,
        line1, city,
        state: document.getElementById('na-state').value,
        zip: document.getElementById('na-zip').value,
        country: document.getElementById('na-country').value,
      };
    }
    renderDelivery();
  });
}

function renderDelivery() {
  markStep(3);
  document.getElementById('checkout-content').innerHTML = `
    <div>
      <div class="checkout-section">
        <h3>Delivery Method</h3>
        <div class="saved-option ${deliveryMethod === 'standard' ? 'selected' : ''}" data-method="standard">
          <div><div style="font-weight:700">Standard Delivery</div><div class="text-soft" style="font-size:13px">3–7 business days · ${cart.shipping === 0 ? 'Free' : formatPrice(cart.shipping)}</div></div>
          <input type="radio" name="delivery" ${deliveryMethod === 'standard' ? 'checked' : ''}>
        </div>
        <div class="saved-option ${deliveryMethod === 'express' ? 'selected' : ''}" data-method="express">
          <div><div style="font-weight:700">Express Delivery</div><div class="text-soft" style="font-size:13px">1–2 business days · $15.00</div></div>
          <input type="radio" name="delivery" ${deliveryMethod === 'express' ? 'checked' : ''}>
        </div>
        <div class="flex justify-between" style="margin-top:20px">
          <button class="btn btn-ghost" id="back-2">Back</button>
          <button class="btn btn-primary" id="to-step-4">Continue to Payment</button>
        </div>
      </div>
    </div>
    ${summarySidebar()}`;
  document.querySelectorAll('[data-method]').forEach(el => el.addEventListener('click', () => {
    deliveryMethod = el.dataset.method;
    document.querySelectorAll('[data-method]').forEach(x => { x.classList.remove('selected'); x.querySelector('input').checked = false; });
    el.classList.add('selected'); el.querySelector('input').checked = true;
  }));
  document.getElementById('back-2').addEventListener('click', renderShipping);
  document.getElementById('to-step-4').addEventListener('click', renderPayment);
}

function paymentCardHTML(pm) {
  return `
    <div class="saved-option ${selectedPaymentId === pm.id ? 'selected' : ''}" data-id="${pm.id}">
      <div style="font-weight:700">${pm.brand} •••• ${pm.last4} ${pm.is_default ? '<span class="default-badge">Default</span>' : ''}</div>
      <input type="radio" name="pm" ${selectedPaymentId === pm.id ? 'checked' : ''}>
    </div>`;
}

function renderPayment() {
  markStep(4);
  document.getElementById('checkout-content').innerHTML = `
    <div>
      <div class="checkout-section">
        <h3>Payment</h3>
        <div id="payment-list">${paymentMethods.map(paymentCardHTML).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-card-btn" style="margin-top:6px">+ Add Payment Method</button>
        <div id="new-card-form" style="display:none;margin-top:18px;border-top:1px solid var(--color-line);padding-top:18px">
          <p class="text-soft" style="font-size:12.5px;margin-bottom:14px">This is a demo — no real payment is processed. We never store your full card number.</p>
          <div class="field"><label>Card Number</label><input id="cc-number" placeholder="4242 4242 4242 4242" maxlength="19"></div>
          <div class="field-row">
            <div class="field"><label>Expiry</label><input id="cc-expiry" placeholder="MM/YY" maxlength="5"></div>
            <div class="field"><label>CVV</label><input id="cc-cvv" placeholder="123" maxlength="4"></div>
          </div>
        </div>
        <div class="flex justify-between" style="margin-top:20px">
          <button class="btn btn-ghost" id="back-3">Back</button>
          <button class="btn btn-primary" id="to-step-5">Review Order</button>
        </div>
      </div>
    </div>
    ${summarySidebar()}`;

  document.querySelectorAll('#payment-list .saved-option').forEach(el => el.addEventListener('click', () => {
    selectedPaymentId = Number(el.dataset.id); newCard = null;
    document.querySelectorAll('#payment-list .saved-option').forEach(x => { x.classList.remove('selected'); x.querySelector('input').checked = false; });
    el.classList.add('selected'); el.querySelector('input').checked = true;
    document.getElementById('new-card-form').style.display = 'none';
  }));
  document.getElementById('add-card-btn').addEventListener('click', () => {
    selectedPaymentId = null;
    document.querySelectorAll('#payment-list .saved-option').forEach(x => x.classList.remove('selected'));
    document.getElementById('new-card-form').style.display = 'block';
  });
  document.getElementById('back-3').addEventListener('click', renderDelivery);
  document.getElementById('to-step-5').addEventListener('click', () => {
    if (!selectedPaymentId) {
      const num = document.getElementById('cc-number').value.replace(/\s+/g, '');
      if (num.length < 12) { Toast.show('Please enter a valid card, or select a saved payment method.'); return; }
      newCard = { card_number: num, expiry: document.getElementById('cc-expiry').value };
    }
    renderReview();
  });
}

function renderReview() {
  markStep(5);
  const addr = selectedAddressId ? addresses.find(a => a.id === selectedAddressId) : newAddress;
  const pmLabel = selectedPaymentId ? (() => { const p = paymentMethods.find(x => x.id === selectedPaymentId); return `${p.brand} •••• ${p.last4}`; })() : `Card •••• ${newCard.card_number.slice(-4)}`;

  document.getElementById('checkout-content').innerHTML = `
    <div>
      <div class="checkout-section">
        <h3>Review Your Order</h3>
        <div style="margin-bottom:18px">
          <div class="text-soft" style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Shipping To</div>
          <div style="font-size:14px">${addr.full_name}<br>${addr.line1}, ${addr.city}${addr.state ? ', ' + addr.state : ''} ${addr.zip}<br>${addr.country || ''}</div>
        </div>
        <div style="margin-bottom:18px">
          <div class="text-soft" style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Delivery</div>
          <div style="font-size:14px">${deliveryMethod === 'express' ? 'Express Delivery (1–2 business days)' : 'Standard Delivery (3–7 business days)'}</div>
        </div>
        <div style="margin-bottom:24px">
          <div class="text-soft" style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Payment</div>
          <div style="font-size:14px">${pmLabel}</div>
        </div>
        <div class="flex justify-between">
          <button class="btn btn-ghost" id="back-4">Back</button>
          <button class="btn btn-primary" id="place-order-btn">Place Order</button>
        </div>
      </div>
    </div>
    ${summarySidebar()}`;
  document.getElementById('back-4').addEventListener('click', renderPayment);
  document.getElementById('place-order-btn').addEventListener('click', placeOrder);
}

async function placeOrder() {
  const btn = document.getElementById('place-order-btn');
  btn.disabled = true; btn.textContent = 'Placing order...';
  try {
    const payload = {};
    if (selectedAddressId) payload.addressId = selectedAddressId; else payload.address = newAddress;
    if (selectedPaymentId) payload.paymentMethodId = selectedPaymentId; else payload.mockCardLast4 = newCard.card_number.slice(-4);
    const { orderId, orderNumber } = await API.post('/api/orders', payload);
    location.href = `/order-confirmation.html?order=${orderId}&num=${orderNumber}`;
  } catch (e) {
    Toast.show(e.message || 'Could not place order.');
    btn.disabled = false; btn.textContent = 'Place Order';
  }
}

async function load() {
  if (!requireAuthOrRedirect()) return;
  cart = await API.get('/api/cart');
  if (!cart.items.length) { location.href = '/cart.html'; return; }
  const [a, p] = await Promise.all([API.get('/api/addresses'), API.get('/api/payment-methods')]);
  addresses = a.addresses; paymentMethods = p.payment_methods;
  selectedAddressId = (addresses.find(x => x.is_default) || addresses[0] || {}).id || null;
  selectedPaymentId = (paymentMethods.find(x => x.is_default) || paymentMethods[0] || {}).id || null;
  renderContact();
}
document.addEventListener('chrome:ready', load);
</script>
</body>
</html>
