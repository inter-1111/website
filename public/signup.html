<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — M3RAFSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="signup">
<div id="site-header-slot"></div>

<div class="container">
  <div class="form-card">
    <h1>Create Your Account</h1>
    <p class="form-sub">Join M3RAFSH to check out, track orders, and save your favorites.</p>
    <div class="form-error" id="form-error"></div>
    <form id="signup-form">
      <div class="field"><label>Full Name</label><input type="text" id="name" required></div>
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <div class="field"><label>Phone (optional)</label><input type="tel" id="phone"></div>
      <div class="field"><label>Password</label><input type="password" id="password" minlength="6" required></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="confirm" minlength="6" required></div>
      <div class="checkbox-row" style="margin-bottom:22px"><input type="checkbox" id="terms" required> I agree to the Terms of Service and Privacy Policy</div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-btn">Create Account</button>
    </form>
    <div class="divider-or">or</div>
    <p style="text-align:center;font-size:14px">Already have an account? <a href="/login.html" id="login-link" style="text-decoration:underline;font-weight:600">Log in</a></p>
  </div>
</div>

<div id="site-footer-slot"></div>
<script src="/js/api.js"></script>
<script src="/js/placeholder.js"></script>
<script src="/js/main.js"></script>
<script>
const next = new URLSearchParams(location.search).get('next') || '/dashboard.html';
document.getElementById('login-link').href = '/login.html?next=' + encodeURIComponent(next);

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('form-error');
  errBox.classList.remove('show');
  if (document.getElementById('password').value !== document.getElementById('confirm').value) {
    errBox.textContent = 'Passwords do not match.'; errBox.classList.add('show'); return;
  }
  const btn = document.getElementById('signup-btn');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    await API.post('/api/auth/signup', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      password: document.getElementById('password').value,
    });
    location.href = next;
  } catch (err) {
    errBox.textContent = err.message; errBox.classList.add('show');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
