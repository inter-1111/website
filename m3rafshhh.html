      desc: f.desc.trim(), image: f.image,
    };
    if(isEdit){ ctx.adminUpdateBrand(brand.id, fields); }
    else{ ctx.adminAddBrand(fields); }
    onClose();
  }

  return (
    <div className="auth-scrim" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="auth-card" style={{width:520}}>
        <button className="auth-close icon-btn" onClick={onClose}><Icon.close width="18" height="18"/></button>
        <h2>{isEdit?'Edit brand':'Add brand'}</h2>
        <p className="sub">{isEdit?brand.name:'New marketplace label'}</p>
        <form onSubmit={submit}>
          <div className="field">
            <label>Cover image</label>
            <div style={{display:'flex', gap:14, alignItems:'center'}}>
              <div style={{position:'relative', width:88, height:60, borderRadius:2, overflow:'hidden', flexShrink:0}}>
                <BrandCoverArt brand={{...f, name: f.name || 'Brand'}}/>
              </div>
              <div>
                <input type="file" accept="image/*" onChange={e=>onImageFile(e.target.files[0])}/>
                {f.image && <button type="button" className="link-btn" style={{marginTop:6, display:'block'}} onClick={()=>set('image',null)}>Remove image</button>}
              </div>
            </div>
          </div>
          <div className="field"><label>Name</label><input value={f.name} onChange={e=>set('name',e.target.value)}/></div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
            <div className="field">
              <label>Accent color</label>
              <input type="color" value={f.color} onChange={e=>set('color',e.target.value)} style={{height:40, padding:2, width:'100%'}}/>
            </div>
          </div>
          <div className="field">
            <label>Description</label>
            <textarea rows={3} value={f.desc} onChange={e=>set('desc',e.target.value)} placeholder="A short line about this label…"/>
          </div>
          <div style={{display:'flex', gap:10, marginTop:10}}>
            <button className="btn btn-block" type="submit">{isEdit?'Save changes':'Add brand'}</button>
            <button className="btn btn-outline btn-block" type="button" onClick={onClose}>Cancel</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AdminOrderRow({ctx, o}){
  const [showCancel, setShowCancel] = useState(false);
  const [reason, setReason] = useState('');
  return (
    <React.Fragment>
      <tr>
        <td>{o.id}</td>
        <td>{new Date(o.date).toLocaleDateString()}</td>
        <td>{o.customerName || '—'}</td>
        <td>{o.items.reduce((s,i)=>s+i.qty,0)}</td>
        <td className="mono">{fmt(o.total)}</td>
        <td>
          <select value={o.status} onChange={e=>{
            const v = e.target.value;
            if(v==='Cancelled'){ setShowCancel(true); return; }
            ctx.updateOrderStatus(o.id, v);
          }}>
            {['Processing','Shipped','Delivered','Cancelled'].map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </td>
        <td>
          {o.status!=='Cancelled' && <button className="link-btn" onClick={()=>setShowCancel(true)}>Cancel</button>}
          {o.status==='Cancelled' && o.cancelReason && <span style={{fontSize:11.5, color:'var(--ink-soft)'}}>{o.cancelReason}</span>}
        </td>
      </tr>
      {showCancel && (
        <tr>
          <td colSpan="7" style={{background:'var(--porcelain)'}}>
            <div style={{display:'flex', gap:10, alignItems:'center', padding:'10px 0'}}>
              <input placeholder="Reason for cancellation" value={reason} onChange={e=>setReason(e.target.value)} style={{flex:1, padding:'10px 12px', border:'1px solid var(--sand-line)', borderRadius:2}}/>
              <button className="btn btn-sm" onClick={()=>{ ctx.updateOrderStatus(o.id,'Cancelled',reason||'No reason given'); setShowCancel(false); setReason(''); }}>Confirm Cancel</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setShowCancel(false)}>Back</button>
            </div>
          </td>
        </tr>
      )}
    </React.Fragment>
  );
}

function catalogSummary(){
  return PRODUCTS.map(p=>({
    id:p.id, brand:p.brand, name:p.name, gender:p.gender, category:p.category,
    price:finalPrice(p), colors:p.colors.map(c=>c.name), tags:p.tags,
  }));
}

function runLocalFilter(params){
  params = params || {};
  return PRODUCTS.filter(p=>{
    if(params.gender && params.gender!=='any' && p.gender!==params.gender) return false;
    if(params.category && p.category.toLowerCase()!==String(params.category).toLowerCase()) return false;
    if(params.brand && p.brand.toLowerCase()!==String(params.brand).toLowerCase()) return false;
    if(params.color && !p.colors.some(c=>c.name.toLowerCase()===String(params.color).toLowerCase())) return false;
    if(params.maxPrice && finalPrice(p)>params.maxPrice) return false;
    if(params.minPrice && finalPrice(p)<params.minPrice) return false;
    if(params.tag && !p.tags.includes(params.tag)) return false;
    if(params.query){
      const q = String(params.query).toLowerCase();
      if(!(p.name+p.brand+p.category+p.desc).toLowerCase().includes(q)) return false;
    }
    return true;
  }).slice(0,6);
}

function AiAssistant({ctx}){
  const {aiOpen, setAiOpen, route, user, orders, cart, goTo, addresses, requireAuth} = ctx;
  const [messages, setMessages] = useState([
    {role:'bot', text:"Hi! I'm your M3RAFSH shopping assistant. What are you looking for today?", chips:['Find a product','Explore categories','Find a brand','Track an order']},
  ]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const bodyRef = useRef(null);

  useEffect(()=>{ if(bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; },[messages, busy]);

  function currentContext(){
    const c = {page: route.page, authenticated: !!user};
    if(route.page==='product'){
      const p = PRODUCTS.find(x=>x.id===route.params.id);
      if(p) c.currentProduct = {id:p.id, name:p.name, brand:p.brand, category:p.category, price:finalPrice(p), gender:p.gender};
    }
    if(route.page==='category' || route.page==='shop') c.currentFilters = route.params;
    c.cartItemCount = cart.filter(l=>!l.savedForLater).reduce((s,l)=>s+l.qty,0);
    return c;
  }

  function executeAction(action){
    if(!action || action.type==='none') return;
    const needsAuth = ['open_orders','open_wishlist','open_profile','track_order'].includes(action.type);
    if(needsAuth && !user){
      setMessages(m=>[...m,{role:'bot', text:"You'll need to log in to see that — I've opened the login screen for you."}]);
      requireAuth('dashboard',{});
      return;
    }
    const params = action.params || {};
    switch(action.type){
      case 'open_product': goTo('product',{id:params.id}); break;
      case 'open_category': goTo('category', {gender:params.gender}); break;
      case 'search_products': goTo('shop', params); break;
      case 'open_brand': {
        const b = BRAND_DEFS.find(x=>x.name.toLowerCase()===String(params.brand||'').toLowerCase() || x.id===params.brandId);
        if(b) goTo('brand',{id:b.id});
        break;
      }
      case 'open_cart': ctx.setCartOpen(true); break;
      case 'open_orders': goTo('dashboard-orders',{}); break;
      case 'open_wishlist': goTo('dashboard-saved',{}); break;
      case 'open_profile': goTo('dashboard',{}); break;
      case 'track_order': goTo('dashboard-orders',{}); break;
      default: break;
    }
  }

  async function callAssistant(userText){
    const ctxObj = currentContext();
    const ordersSummary = user ? orders.slice(0,5).map(o=>({id:o.id, status:o.status, total:o.total, itemCount:o.items.reduce((s,i)=>s+i.qty,0)})) : [];
    const system = `You are the site-aware shopping assistant for M3RAFSH, a multi-brand local fashion marketplace.
You are given the FULL product catalog and the shopper's current context below. Never invent products, brands, categories, ids or prices that are not in the catalog.
Respond to the shopper's message and answer ONLY with strict JSON, no markdown, no code fences, matching exactly this schema:
{"reply": string, "product_ids": string[], "action": {"type": "search_products"|"open_product"|"open_category"|"open_brand"|"open_cart"|"open_orders"|"open_wishlist"|"open_profile"|"track_order"|"none", "params": object}}
Rules:
- "reply" is a short, warm, helpful natural-language answer (max ~2 sentences).
- "product_ids" is up to 4 ids taken EXACTLY from the catalog's "id" field, only when products are genuinely relevant to show.
- If the shopper is on a product page and asks a relative question like "something cheaper" or "similar to this", use currentProduct as the reference point (same category/gender, lower price, etc).
- If the shopper asks about their cart/orders/wishlist/profile and is not authenticated, still set the appropriate action type (the app will prompt login).
- "action.type" "open_category" needs params {"gender":"men"|"women"|"unisex"}. "search_products" needs params among {gender,category,color,maxPrice,minPrice,tag,query}. "open_brand" needs params {"brand": brandName}. "open_product" needs {"id": productId}.
- Use "none" action when just answering a question with no navigation, e.g. comparing two products.
- Keep it grounded only in the catalog and context data given below.

CATALOG (condensed): ${JSON.stringify(catalogSummary())}
CONTEXT: ${JSON.stringify(ctxObj)}
RECENT ORDERS (if authenticated): ${JSON.stringify(ordersSummary)}`;

    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), ASSISTANT_TIMEOUT_MS);
    try{
      const response = await fetch(ASSISTANT_API_URL, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+ASSISTANT_API_KEY,
        },
        signal: controller.signal,
        body: JSON.stringify({
          model: ASSISTANT_MODEL,
          messages:[
            {role:"system", content: system},
            {role:"user", content: userText},
          ],
        })
      });
      clearTimeout(timeoutId);
      if(!response.ok){
        throw new Error("Assistant API returned "+response.status);
      }
      const data = await response.json();
      let raw = data?.choices?.[0]?.message?.content || '{}';
      raw = raw.trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
      let parsed;
      try{ parsed = JSON.parse(raw); }
      catch(e){ parsed = {reply: raw || "Sorry, I couldn't quite parse that — could you try rephrasing?", product_ids:[], action:{type:'none'}}; }
      return parsed;
    }catch(e){
      clearTimeout(timeoutId);
      const fallbackResults = runLocalFilter({query:userText});
      return {
        reply: fallbackResults.length ? "I couldn't reach the assistant service, but here's what I found by keyword in the catalog:" : "Sorry, I couldn't reach the assistant right now. Try browsing the shop instead.",
        product_ids: fallbackResults.map(p=>p.id),
        action: {type:'none'},
      };
    }
  }

  async function send(text){
    const t = (text||input).trim();
    if(!t || busy) return;
    setMessages(m=>[...m, {role:'user', text:t}]);
    setInput('');
    setBusy(true);
    const result = await callAssistant(t);
    setBusy(false);
    const ids = Array.isArray(result.product_ids) ? result.product_ids : [];
    const products = ids.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);
    setMessages(m=>[...m, {role:'bot', text: result.reply || '...', products, action: result.action}]);
  }

  function handleChip(label){
    const map = {
      'Find a product':'Show me something new I might like.',
      'Explore categories':"What categories are on the marketplace?",
      'Find a brand':'Tell me about the brands on M3RAFSH.',
      'Track an order':'Track my latest order.',
    };
    send(map[label] || label);
  }

  return (
    <React.Fragment>
      <button className="ai-fab" onClick={()=>setAiOpen(v=>!v)} aria-label="Shop Assistant">
        {aiOpen ? <Icon.close width="22" height="22"/> : <Icon.spark width="24" height="24"/>}
      </button>
      {aiOpen && (
        <div className="ai-panel">
          <div className="ai-head">
            <div className="t"><Icon.spark width="16" height="16"/> Shop Assistant</div>
            <button className="icon-btn" style={{color:'#fff'}} onClick={()=>setAiOpen(false)}><Icon.close width="18" height="18"/></button>
          </div>
          <div className="ai-body" ref={bodyRef}>
            {messages.map((m,i)=>(
              <React.Fragment key={i}>
                <div className={'ai-msg '+m.role}>{m.text}</div>
                {m.products && m.products.length>0 && (
                  <div className="ai-prod-strip">
                    {m.products.map(p=>(
                      <div key={p.id} className="ai-prod-card" onClick={()=>{ ctx.recordView(p.id); goTo('product',{id:p.id}); setAiOpen(false); }}>
                        <div className="m"><GarmentArt category={p.category} image={p.image}/></div>
                        <div className="n">{p.name}</div>
                        <div className="p">{fmt(finalPrice(p))}</div>
                      </div>
                    ))}
                  </div>
                )}
                {m.action && m.action.type && m.action.type!=='none' && (
                  <button className="ai-action-btn" onClick={()=>executeAction(m.action)}>
                    {({
                      search_products:'View Results',
                      open_product:'Open Product',
                      open_category:'Open Category',
                      open_brand:'Open Brand',
                      open_cart:'Open Cart',
                      open_orders:'View Orders',
                      open_wishlist:'View Saved Items',
                      open_profile:'Open Profile',
                      track_order:'Track Order',
                    })[m.action.type] || 'Open'}
                  </button>
                )}
                {m.chips && (
                  <div className="ai-chips">
                    {m.chips.map(c=> <button key={c} className="ai-chip" onClick={()=>handleChip(c)}>{c}</button>)}
                  </div>
                )}
              </React.Fragment>
            ))}
            {busy && <div className="ai-msg bot"><div className="typing-dots"><span/><span/><span/></div></div>}
          </div>
          <div className="ai-input-row">
            <input placeholder="Ask anything…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') send(); }} disabled={busy}/>
            <button onClick={()=>send()} disabled={busy || !input.trim()} aria-label="Send"><Icon.send width="16" height="16"/></button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}
